  /v1/data-acquisition-runs:
    get:
      description: Recent runs, newest first. Headers only -- a scope and its failures
        are the detail read.
      operationId: listRuns
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunsBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Runs
      tags:
      - acquisition
    post:
      description: 'Start a run, and answer with it.


        **Money first, if any source charges.** A run that can spend with no cap set
        is refused

        with 409 unless the request accepts an uncapped one -- nothing here invents
        a ceiling

        (`reqs.md` 6.3).


        **It runs inline today, and the response carries a finished run.** 202 is
        still right --

        the work was accepted and the client polls the id either way -- but claiming
        the run is in

        flight when it is not would be a lie a screen could act on. A full sweep of
        every source

        fits in one request, and a background task would add a lifecycle to manage
        for no benefit

        anybody can currently see. Making it genuinely asynchronous is a change here
        and nowhere else,

        because the run record already holds everything the polling endpoint reads
        (`arch.md` 8.4).


        The run row exists before any figure is fetched, so a process that dies mid-run
        leaves a

        visibly unfinished run rather than nothing at all.'
      operationId: startRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequestBody'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Run
      tags:
      - acquisition
  /v1/data-acquisition-runs/plan:
    post:
      description: 'What a run would do, without doing any of it.


        Counts the work as the cross product of candidates and answerable attributes.
        An attribute no

        adapter can supply is not counted: promising to fetch something nothing can
        fetch would make

        the estimate a wish.


        **An item is one candidate and one attribute**, however many sources answer
        it -- the unit a

        run''s progress counts and a retry addresses. `by_source` says what each source
        will be asked,

        so where two answer the same attribute its entries sum to more than `items_total`,
        which is

        the truth: the tax rate for Germany is one item, asked of OECD and of the
        estimate.'
      operationId: planRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunScopeBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPlanBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Plan Run
      tags:
      - acquisition
  /v1/data-acquisition-runs/{run_id}:
    get:
      description: One run with its scope, progress and failures -- what a screen
        polls.
      operationId: getRun
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: integer
      responses:
