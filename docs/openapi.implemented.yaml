      description: 'What one gate says about one candidate.


        **Close to the evaluation''s match status, and deliberately not the same enumeration.**
        An

        evaluation reports `matching`, `not_matching` or `insufficient_data`; a gate
        reports

        `matching`, `not_matching` or `unknown`. The first two members mean the same
        thing in both

        -- there is one match vocabulary in this application -- but the third members
        answer

        different questions and must not be merged.


        `unknown` is a gate **nobody has researched yet**: the Swiss quota may well
        be open, and

        nobody has looked. `insufficient_data` is a candidate whose values are **too
        sparse to

        score**. A country whose visa route is `unknown` may be perfectly scoreable,
        and a country

        with every gate answered may still be unscoreable. One enumeration covering
        both would

        make each of those states unsayable.'
