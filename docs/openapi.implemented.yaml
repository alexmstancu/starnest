  /v1/data-acquisition-runs/{run_id}/retry:
    post:
      description: "A **new** run over part of the run named, which keeps its own\
        \ record either way.\n\n`reqs.md` 6.4 and Q217. **Two different acts through\
        \ one resource**, because both create a\nrun over a subset of an earlier one's\
        \ scope:\n\n- `failed` (the default) asks only the sources that failed, only\
        \ about what they failed on.\n- `unanswered` asks again about the items that\
        \ produced neither a figure nor a failure.\n  There is no source to narrow\
        \ to -- none failed -- so every source that can answer those\n  attributes\
        \ is asked.\n\nA run with nothing of the kind asked for is refused with 409:\
        \ a run over an empty scope\nwould be a no-op recorded as though it were work."
      operationId: retryRun
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RetryBody'
              - type: 'null'
              title: Body
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Retry
      tags:
      - acquisition
