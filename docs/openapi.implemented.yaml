    PillarWeightsBody:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PillarWeightBody'
          title: Items
          type: array
      required:
      - items
      title: PillarWeightsBody
      type: object
    PillarsBody:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PillarBody'
          title: Items
          type: array
      required:
      - items
      title: PillarsBody
      type: object
    ProgressBody:
      properties:
        items_completed:
          title: Items Completed
          type: integer
        items_failed:
          title: Items Failed
          type: integer
        items_total:
          title: Items Total
          type: integer
        items_unanswered:
          title: Items Unanswered
          type: integer
      required:
      - items_total
      - items_completed
      - items_failed
      - items_unanswered
      title: ProgressBody
      type: object
    RankingBody:
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/CandidateResultBody'
          title: Candidates
          type: array
        computed_at:
          format: date-time
          title: Computed At
          type: string
        criteria_set:
          title: Criteria Set
          type: string
        level:
          title: Level
          type: string
      required:
      - criteria_set
      - level
      - computed_at
      - candidates
      title: RankingBody
      type: object
    RebalancedPillar:
      description: 'What a weight change actually produced: the whole pillar, as it
        now stands.'
      properties:
        criteria:
          items:
            $ref: '#/components/schemas/CriterionBody'
          title: Criteria
          type: array
        pillar:
          title: Pillar
          type: string
      required:
      - pillar
      - criteria
      title: RebalancedPillar
      type: object
    ReferencePeriodBody:
      properties:
        end:
          format: date
          title: End
          type: string
        start:
          format: date
          title: Start
          type: string
      required:
      - start
      - end
      title: ReferencePeriodBody
      type: object
    RenameBody:
      properties:
        name:
          title: Name
          type: string
      required:
      - name
      title: RenameBody
      type: object
    ResearchOutcomeBody:
      properties:
        calls:
          title: Calls
          type: integer
        cost_eur:
          title: Cost Eur
          type: number
        halted_on_spend_cap:
          title: Halted On Spend Cap
          type: boolean
        proposals:
          items:
            $ref: '#/components/schemas/MatchRuleResultBody'
          title: Proposals
          type: array
        refusals:
          default: []
          items:
            type: string
          title: Refusals
          type: array
      required:
      - proposals
      - cost_eur
      - calls
      - halted_on_spend_cap
      title: ResearchOutcomeBody
      type: object
    ResearchPlanBody:
      description: What a research pass would ask and what it would cost (`reqs.md`
        6.3).
      properties:
        estimate_basis:
          anyOf:
          - type: string
          - type: 'null'
          title: Estimate Basis
        estimated_cost_eur:
          title: Estimated Cost Eur
          type: number
        gates_total:
          title: Gates Total
          type: integer
        llm_call_count:
          title: Llm Call Count
          type: integer
      required:
      - gates_total
      - llm_call_count
      - estimated_cost_eur
      title: ResearchPlanBody
      type: object
    ResearchRequestBody:
      description: Which gates to research, and whether an uncapped spend is accepted
        (`reqs.md` 6.3).
      properties:
        accept_uncapped_spend:
          default: false
          title: Accept Uncapped Spend
          type: boolean
        candidates:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Candidates
        level:
          title: Level
          type: string
        match_rules:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Match Rules
      required:
      - level
      title: ResearchRequestBody
      type: object
    RetryBody:
      description: Which part of the run to go over again. Absent means the failures,
        as it always did.
      properties:
        items:
          default: failed
          enum:
          - failed
          - unanswered
          title: Items
          type: string
      title: RetryBody
      type: object
    RunBody:
      additionalProperties: true
      type: object
    RunDetailBody:
      additionalProperties: true
      type: object
    RunPlanBody:
      properties:
        by_source:
          default: []
          items:
            $ref: '#/components/schemas/BySourceBody'
          title: By Source
          type: array
        estimate_basis:
          anyOf:
          - type: string
          - type: 'null'
          title: Estimate Basis
        estimated_cost_eur:
          title: Estimated Cost Eur
          type: number
        items_total:
          title: Items Total
          type: integer
        llm_call_count:
          title: Llm Call Count
          type: integer
      required:
      - items_total
      - llm_call_count
      - estimated_cost_eur
      title: RunPlanBody
      type: object
    RunRequestBody:
      description: 'A scope, and whether an uncapped run is accepted (`reqs.md` 6.3).


        **Per request, never stored.** A cap is a setting; accepting the absence of
        one is a

        sentence about this one run. Remembering it would turn a deliberate act into
        a default.'
      properties:
        accept_uncapped_spend:
          default: false
          title: Accept Uncapped Spend
          type: boolean
        attributes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Attributes
        candidates:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Candidates
        level:
          title: Level
          type: string
      required:
      - level
      title: RunRequestBody
      type: object
    RunScopeBody:
      description: What a run is asked to cover. Null means everything at the level.
      properties:
        attributes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Attributes
        candidates:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Candidates
        level:
          title: Level
          type: string
      required:
      - level
      title: RunScopeBody
      type: object
    RunsBody:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RunBody'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: RunsBody
      type: object
    SaveEvaluationBody:
      properties:
        criteria_set:
          title: Criteria Set
          type: string
        level:
          title: Level
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      required:
      - criteria_set
      - level
      title: SaveEvaluationBody
      type: object
    ScaleAnchorBody:
      properties:
        input_value:
          title: Input Value
          type: number
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        score:
          title: Score
          type: integer
      required:
      - input_value
      - score
      title: ScaleAnchorBody
      type: object
    SettingsBody:
      description: '`SettingsInput` from the contract, which `Settings` is defined
        as.


        **The two percentages travel as numbers, not as `Decimal`.** The contract
        types them

        `number`, and Pydantic renders a `Decimal` as a JSON string -- which is lossless,
        and not

        what the design says. It went unnoticed while every setting was null (`known-issues.md`
        P16).'
      properties:
        comparator_limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Comparator Limit
        min_coverage:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Coverage
        run_spend_cap_eur:
          anyOf:
          - type: number
          - type: 'null'
          title: Run Spend Cap Eur
        score_scale_max:
          anyOf:
          - type: integer
          - type: 'null'
          title: Score Scale Max
      title: SettingsBody
      type: object
    SynthesisBody:
      properties:
        advantages:
          default: []
          items:
            type: string
          title: Advantages
          type: array
        comparator:
          title: Comparator
          type: string
        disadvantages:
          default: []
          items:
            type: string
          title: Disadvantages
          type: array
        score_delta:
          anyOf:
          - type: integer
          - type: 'null'
          title: Score Delta
      required:
      - comparator
      title: SynthesisBody
      type: object
    UnansweredBody:
      description: An item nobody answered. No source, because none failed -- see
        `store.UnansweredItem`.
      properties:
        attribute:
          title: Attribute
          type: string
        candidate:
          title: Candidate
          type: string
      required:
      - candidate
      - attribute
      title: UnansweredBody
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    ValueBody:
      properties:
        attribute:
          title: Attribute
          type: string
        breakdown_option:
          anyOf:
          - type: string
          - type: 'null'
          title: Breakdown Option
        candidate:
          title: Candidate
          type: string
        citations:
          default: []
          items:
            type: string
          title: Citations
          type: array
        confidence_level:
          title: Confidence Level
          type: string
        data_acquisition_run:
          anyOf:
          - type: integer
          - type: 'null'
          title: Data Acquisition Run
        data_source:
          title: Data Source
          type: string
        id:
          title: Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        payload:
          additionalProperties: true
          title: Payload
          type: object
        quote:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote
        reference_period:
          $ref: '#/components/schemas/ReferencePeriodBody'
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        retrieval_date:
          format: date-time
          title: Retrieval Date
          type: string
        value_type:
          title: Value Type
          type: string
      required:
      - id
      - candidate
      - attribute
      - value_type
      - payload
      - data_source
      - reference_period
      - retrieval_date
      - confidence_level
      - is_active
      title: ValueBody
      type: object
    ValuesBody:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ValueBody'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: ValuesBody
      type: object
    WarningBody:
      properties:
        compound_rule:
          title: Compound Rule
          type: string
        detail:
          title: Detail
          type: string
      required:
      - compound_rule
      - detail
      title: WarningBody
      type: object
info:
  title: Starnest
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/attributes:
    get:
      description: 'The catalog, with every per-attribute declaration attached.


        Retired attributes are excluded unless asked for: they keep their stored values
        and drop out

        of scoring, so a caller that wants them has to say so.'
      operationId: listAttributes
      parameters:
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - in: query
        name: include_retired
        required: false
        schema:
          default: false
          title: Include Retired
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributesBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Attributes
      tags:
      - catalog
  /v1/attributes/{attribute_id}:
    get:
      description: One attribute with its declarations. Raises a 404 for one the catalog
        does not hold.
      operationId: getAttribute
      parameters:
      - in: path
        name: attribute_id
        required: true
        schema:
          title: Attribute Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Attribute
      tags:
      - catalog
  /v1/candidates:
    get:
      description: 'Every candidate, or every candidate at one level.


        `parent` is in the contract for the city level and is accepted rather than
        ignored: a filter

        silently dropped would return every country to a caller that asked for one
        country''s cities.'
      operationId: listCandidates
      parameters:
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - in: query
        name: parent
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Candidates
      tags:
      - catalog
  /v1/candidates/{candidate_id}:
    get:
      description: One candidate. Raises a 404 for one the catalog does not hold.
      operationId: getCandidate
      parameters:
      - in: path
        name: candidate_id
        required: true
        schema:
          title: Candidate Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Candidate
      tags:
      - catalog
  /v1/comparisons:
    get:
      description: 'The focus against each comparator, attribute by attribute, with
        the synthesis.


        A candidate at another level is simply not in this level''s ranking and is
        refused by name,

        which is how "comparisons never mix levels" enforces itself rather than being
        remembered.'
      operationId: getComparison
      parameters:
      - in: query
        name: criteria_set
        required: true
        schema:
          title: Criteria Set
          type: string
      - in: query
        name: level
        required: true
        schema:
          title: Level
          type: string
      - in: query
        name: focus
        required: true
        schema:
          title: Focus
          type: string
      - in: query
        name: comparators
        required: false
        schema:
          default: []
          items:
            type: string
          title: Comparators
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Comparison
      tags:
      - evaluation
  /v1/compound-rules:
    get:
      description: 'The rules that read more than one figure at once (`reqs.md` 3.7a).


        Both the MVP ships are **undecided** -- every threshold in `reqs.md` 7.4 is
        TBD -- so they

        are listed with null bounds and fire nothing. That is the shipping state,
        not an omission:

        a rule fired on an invented number is the fabricated judgement this application
        prevents.'
      operationId: listCompoundRules
      parameters:
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundRulesBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Compound Rules
      tags:
      - rules
  /v1/criteria-sets:
    get:
      description: 'Headers only. Reading 41 criteria per set to fill a dropdown would
        make the most

        frequently rendered element in the product the most expensive one.'
      operationId: listCriteriaSets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetsBody'
          description: Successful Response
      summary: List Criteria Sets
      tags:
      - catalog
    post:
      description: 'A new, empty set of priorities.


        **Empty, not copied.** The design gives this an identifier and a name and
        nothing else, and

        choosing a set to copy from would be this endpoint deciding whose priorities
        a new set

        starts from. A set with no criteria scores nothing, and `GET /rankings` says
        exactly that

        rather than producing a ranking out of an empty opinion.


        Refused with 409 when the identifier is taken: silently replacing a set somebody
        built is

        the worst kind of success (`criteria/store.py`).'
      operationId: createCriteriaSet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCriteriaSetBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Criteria Set
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}:
    delete:
      description: 'Discard a set of priorities.


        **A saved evaluation froze its own copy** (`reqs.md` Q193), so deleting the
        set it was

        computed from leaves it readable -- which is why this store has a delete and
        `ValueStore`

        deliberately does not: an opinion may be withdrawn, a measurement may not.'
      operationId: deleteCriteriaSet
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Criteria Set
      tags:
      - criteria
    get:
      description: 'One whole set. `level` narrows the criteria and the pillar weights
        together.


        Never one without the other: weights sum to 100 within a level, so narrowing
        only the

        criteria would return a set whose pillar weights summed to 200 -- and the
        domain would

        refuse to build it, which is the right outcome reached the wrong way.'
      operationId: getCriteriaSet
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Criteria Set
      tags:
      - criteria
    patch:
      description: The name, and only the name. Weights move through their own endpoints.
      operationId: renameCriteriaSet
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rename Criteria Set
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}/compound-rules/{compound_rule_id}:
    put:
      description: 'Whether this set applies a compound rule. An undecided rule fires
        either way -- which is

        to say, not at all (`reqs.md` 7.4).'
      operationId: setCompoundRuleApplication
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      - in: path
        name: compound_rule_id
        required: true
        schema:
          title: Compound Rule Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationBody'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Compound Rule Application
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}/criteria/{attribute_id}:
    patch:
      description: 'Move one weight, and return the pillar it moved within.


        The whole pillar comes back because the whole pillar changed: raising one
        criterion lowers

        its unlocked siblings so the pillar still sums to 100 (`reqs.md` 5.2). Returning
        only the

        criterion that was asked about would leave the screen showing a set that does
        not add up.


        Raises `WeightsAllLockedError` -- a 409 -- when every other weight in the
        pillar is locked,

        naming the locks so the screen can say which ones.'
      operationId: updateCriterion
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      - in: path
        name: attribute_id
        required: true
        schema:
          title: Attribute Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancedPillar'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Criterion
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}/duplicate:
    post:
      description: 'Copy a set whole, under a new identifier.


        **A full copy, never a sparse overlay** (`reqs.md` Q191). "Inherit from the
        default for

        anything not overridden" cannot hold: weights sum to 100 within a pillar,
        so an override

        that did not move its siblings would sum to 118. `CriteriaSet.duplicated_as`
        produces the

        copy and the store writes it, so what a copy contains is decided in one place
        -- the domain

        -- rather than here and in the SQL separately.


        A duplicate is how a user gets a set they may change without touching the
        shipped one, which

        is what makes `local_employment` safe to leave exactly as seeded.'
      operationId: duplicateCriteriaSet
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Duplicate Criteria Set
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}/match-rules/{match_rule_id}:
    put:
      description: 'Whether this set enforces a gate.


        **A preference, not a fact** (`arch.md` 3.6): the gate''s answer belongs to
        the candidate and

        stays stored either way; this decides only whether it counts against the score.'
      operationId: setMatchRuleEnforcement
      parameters:
      - in: path
        name: criteria_set_id
        required: true
