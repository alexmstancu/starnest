      description: 'What researching the gates would cost, without asking anything.


        **The estimate before the spend** (`reqs.md` 6.3, Q22): research is the most
        expensive thing

        this application does -- one call per gate per candidate -- and the household
        should see the

        bill before agreeing to it rather than after. It counts the same pairs the
        pass would ask

        about, through the same function (`gates_to_ask`), so the two cannot disagree:
        a gate asked

        only at another level, or one somebody has already confirmed, is in neither.


        Nothing is stored and nothing is charged. With no model configured this is
        a 501, as the

        pass itself is: an estimate of zero would read as "this would cost nothing".'
