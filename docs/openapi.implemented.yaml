info:
  title: Starnest
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/attributes:
    get:
      description: 'The catalog, with every per-attribute declaration attached.


        Retired attributes are excluded unless asked for: they keep their stored values
        and drop out

        of scoring, so a caller that wants them has to say so.'
      operationId: listAttributes
      parameters:
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - in: query
        name: include_retired
        required: false
        schema:
          default: false
          title: Include Retired
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributesBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Attributes
      tags:
      - catalog
  /v1/candidates:
    get:
      description: 'Every candidate, or every candidate at one level.


        `parent` is in the contract for the city level and is accepted rather than
        ignored: a filter

        silently dropped would return every country to a caller that asked for one
        country''s cities.'
      operationId: listCandidates
      parameters:
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - in: query
        name: parent
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Candidates
      tags:
      - catalog
  /v1/criteria-sets:
    get:
      description: 'Headers only. Reading 41 criteria per set to fill a dropdown would
        make the most

        frequently rendered element in the product the most expensive one.'
      operationId: listCriteriaSets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetsBody'
          description: Successful Response
      summary: List Criteria Sets
      tags:
      - catalog
  /v1/criteria-sets/{criteria_set_id}:
    get:
      description: 'One whole set. `level` narrows the criteria and the pillar weights
        together.


        Never one without the other: weights sum to 100 within a level, so narrowing
        only the

        criteria would return a set whose pillar weights summed to 200 -- and the
        domain would

        refuse to build it, which is the right outcome reached the wrong way.'
      operationId: getCriteriaSet
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      - in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Criteria Set
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}/criteria/{attribute_id}:
    patch:
      description: 'Move one weight, and return the pillar it moved within.


        The whole pillar comes back because the whole pillar changed: raising one
        criterion lowers

        its unlocked siblings so the pillar still sums to 100 (`reqs.md` 5.2). Returning
        only the

        criterion that was asked about would leave the screen showing a set that does
        not add up.


        Raises `WeightsAllLockedError` -- a 409 -- when every other weight in the
        pillar is locked,

        naming the locks so the screen can say which ones.'
      operationId: updateCriterion
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      - in: path
        name: attribute_id
        required: true
        schema:
          title: Attribute Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancedPillar'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Criterion
      tags:
      - criteria
  /v1/criteria-sets/{criteria_set_id}/duplicate:
    post:
      description: 'Copy a set whole, under a new identifier.


        **A full copy, never a sparse overlay** (`reqs.md` Q191). "Inherit from the
        default for

        anything not overridden" cannot hold: weights sum to 100 within a pillar,
        so an override

        that did not move its siblings would sum to 118. `CriteriaSet.duplicated_as`
        produces the

        copy and the store writes it, so what a copy contains is decided in one place
        -- the domain

        -- rather than here and in the SQL separately.


        A duplicate is how a user gets a set they may change without touching the
        shipped one, which

        is what makes `local_employment` safe to leave exactly as seeded.'
      operationId: duplicateCriteriaSet
      parameters:
      - in: path
        name: criteria_set_id
        required: true
        schema:
          title: Criteria Set Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriteriaSetBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Duplicate Criteria Set
      tags:
      - criteria
  /v1/household:
    get:
      description: Raises `HouseholdNotConfiguredError` -- a 404 -- when nothing has
        been recorded yet.
      operationId: getHousehold
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdBody'
          description: Successful Response
      summary: Get Household
      tags:
      - household
    put:
      description: 'Store the household whole, and return what was stored.


        Returning it rather than a bare 200: the domain normalises what it accepts
        -- citizenships

        are a set, so duplicates collapse -- and a client that assumed its request
        body was the

        stored state would be wrong in a way nothing told it about.'
      operationId: replaceHousehold
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Replace Household
      tags:
      - household
  /v1/levels:
    get:
      description: In `depth_order`, which is what tells a caller which level screens
        first.
      operationId: listLevels
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelsBody'
          description: Successful Response
      summary: List Levels
      tags:
      - catalog
  /v1/pillars:
    get:
      description: 'The eleven load-bearing verticals of a life (`reqs.md` 3.3).


        Returned whole: eleven rows bounded by the catalog need no cursor (`arch.md`
        7.6).'
      operationId: listPillars
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PillarsBody'
          description: Successful Response
      summary: List Pillars
      tags:
      - catalog
  /v1/rankings:
    get:
      description: 'Score every candidate at this level and return them in rank order.


        `score_scale_max` comes from settings and has no default here. Substituting
        100 where the

        user has set nothing is the plausible-looking fabrication `devplan.md` 0.3
        forbids -- so an

        unset scale is a refusal that names the setting, not a ranking on a scale
        nobody chose.'
      operationId: getRanking
      parameters:
      - in: query
        name: criteria_set
        required: true
        schema:
          title: Criteria Set
          type: string
      - in: query
        name: level
        required: true
        schema:
          title: Level
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingBody'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Ranking
      tags:
      - rankings
  /v1/settings:
    get:
      operationId: getSettings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsBody'
          description: Successful Response
      summary: Get Settings
      tags:
      - settings
