openapi: 3.1.0

info:
  title: Relocation decision-support API
  version: "1.0.0"
  description: |
    The backend contract. Every consumer speaks it: the browser interface, the acceptance
    suite, and anything added later. See `arch.md` 6.4 for the resource design and section 7.6 for
    the conventions below.

    **Conventions**

    - All paths are under `/v1`. Versioned from the first request because the contract has
      consumers other than the interface.
    - **Bodies carry data, never presentation.** Numbers are numbers, dates are dates, money
      is an amount plus a currency code. No pre-formatted strings, no locale, no symbols.
    - **Every measurement carries its provenance**: source, both dates, confidence. This is not
      optional decoration — it is what the product exists to provide.
    - **Two distinct dates**, never merged: `reference_period` is the span the data describes;
      `retrieval_date` is when it was fetched.
    - **Scores, coverage and weights are all percentages, 0–100.** Scores display as integers;
      coverage and weights carry decimals. Weights sum to 100 within a pillar, and pillar
      weights sum to 100 within a level.
    - Errors share one shape and are distinguished by a stable machine-readable `code`.
    - **A request is refused rather than half-read.** A body field or query parameter the
      operation does not declare answers `422 invalid_request` instead of being ignored. A
      malformed request is always a 422, never a 400.
    - No authentication. The service binds to localhost (`reqs.md` 10).

servers:
  - url: http://localhost:8000/v1

tags:
  - name: household
  - name: catalog
    description: Read-only. Changed by migration; there is deliberately no admin interface.
  - name: candidates
  - name: values
  - name: criteria
  - name: rules
  - name: data acquisition
  - name: evaluation

paths:

  /household:
    get:
      tags: [household]
      summary: The household record
      operationId: getHousehold
      responses:
        "200": { $ref: "#/components/responses/Household" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    put:
      tags: [household]
      operationId: replaceHousehold
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HouseholdInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Household" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /settings:
    get:
      tags: [household]
      operationId: getSettings
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    put:
      tags: [household]
      operationId: replaceSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SettingsInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        "409":
          description: >-
            `score_scale_below_anchors`: a criterion anchors a figure to a score above the new top
            of the range. `details.minimum` is the lowest top every live anchor fits under, with
            the `criteria_set` and `attribute` that need it. A null, or a value equal to the stored
            one, is never refused.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /levels:
    get:
      tags: [catalog]
      summary: The ordered levels, and which nests under which
      operationId: listLevels
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Level" } }
          description: OK
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /pillars:
    get:
      tags: [catalog]
      operationId: listPillars
      # No level filter: a pillar carries no level (reqs.md 3.2, Q187). The same eleven
      # concerns apply everywhere; only their weights differ, and those live on a criteria set.
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Pillar" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /attributes:
    get:
      tags: [catalog]
      summary: The attribute catalog
      description: |
        Attributes with `pillar: null` are descriptive: nothing scores them, and they exist to
        make a candidate legible (`reqs.md` 3.3).
      operationId: listAttributes
      parameters:
        - { $ref: "#/components/parameters/LevelFilter" }
        - name: pillar
          in: query
          schema: { type: string }
        - name: scorable_only
          in: query
          description: Exclude descriptive attributes.
          schema: { type: boolean, default: false }
        - name: include_retired
          in: query
          description: |
            Include attributes whose `lifecycle_status` is `retired`. They keep every stored
            value and drop out of scoring, so a caller that wants them has to say so.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Attribute" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /attributes/{attributeId}:
    get:
      tags: [catalog]
      operationId: getAttribute
      parameters: [ { $ref: "#/components/parameters/AttributeId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/Attribute" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-sources:
    get:
      tags: [catalog]
      operationId: listDataSources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DataSource" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-sources/order:
    put:
      tags: [catalog]
      operationId: reorderDataSources
      summary: Put every source in a new order, keeping the priority tiers
      description: >
        One request carrying the whole order, highest priority first, applied in one
        transaction under a lock: a move and its undo can never stop half way, and two reorders
        run one after the other (D36). **The stored priorities are handed back out in the new
        order, never renumbered 1 to n**, so the gaps between tiers survive every move. Two
        sources sharing a priority read back by id, so swapping them gives the pair distinct
        numbers. Whether each source is switched on is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Every source id exactly once, highest priority first.
                  items: { type: string }
      responses:
        "200":
          description: Every source, in the new global order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DataSource" } }
        "422":
          description: >-
            `invalid_source_order` when the order does not name every source exactly once, with
            `details.missing`, `details.repeated` and `details.unknown`, each a list of source
            ids and empty where nothing was wrong with it; nothing is changed. Otherwise as
            `InvalidRequest`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/InvalidRequestError" } }

  /data-sources/{dataSourceId}:
    patch:
      tags: [catalog]
      operationId: updateDataSource
      summary: Switch a source on or off, and set where it stands
      description: >
        Switching a source off stops it being consulted: a run does not ask it, and its stored
        values drop out of the active-value comparison so they are no longer scored. **The
        values themselves are kept** and stay visible in the drill-down with their provenance
        (reqs.md 3.6) -- switching the source back on returns them to the ranking unchanged.
        Scores move when this changes, because the active-value rule is evaluated on every
        read. Both fields are optional and independent.
      parameters:
        - name: dataSourceId
          in: path
          required: true
          schema: { type: string }
          example: numbeo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled: { type: boolean }
                default_priority: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSource" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      parameters:
        - { $ref: "#/components/parameters/LevelFilter" }
        - name: parent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /candidates/{candidateId}:
    get:
      tags: [candidates]
      summary: A candidate with its descriptive attributes
      operationId: getCandidate
      parameters: [ { $ref: "#/components/parameters/CandidateId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/CandidateDetail" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /values:
    get:
      tags: [values]
      summary: Stored values, with full provenance
      description: |
        Returns the active value per attribute by default. `include_superseded` returns every
        value from every source, which is what the drill-down shows — nothing is ever discarded
        (`reqs.md` 3.6).
      operationId: listValues
      parameters:
        - name: data_acquisition_run
          in: query
          description: >
            Narrow to the values one acquisition produced. A value keeps the run that produced
            it for the life of the row, so this is what makes comparing two acquisitions two
            requests rather than a walk of the whole corpus.
          schema: { type: integer }
        - name: reconfirmed_by_run
          in: query
          description: >
            Narrow to the stored values one acquisition re-confirmed: re-read as the same
            observation, so no new row carries that run. Exactly the values the run's
            `reconfirmed` names, for its own items only. Together with data_acquisition_run, it
            is what the run produced. Values a run re-confirmed before it recorded which are not
            listed. Refused with 422 alongside data_acquisition_run.
          schema: { type: integer }
        - { name: candidate, in: query, schema: { type: string } }
        - { name: attribute, in: query, schema: { type: string } }
        - name: include_superseded
          in: query
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Value" } }
                  total: { type: integer }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /values/manual:
    post:
      tags: [values]
      summary: Enter a value by hand
      description: |
        Manual entry is a real source, ranked last, and **permitted only where the attribute
        declares it** (`reqs.md` 6.5). It is how a figure with no adapter gets recorded, and how
        an early estimate is captured so a real dataset can supersede it later without deleting
        anything.

        Rejected with `409 manual_entry_not_permitted` when the attribute does not allow it, and
        with `409 conflicting_observation` when another figure is already on record under the
        same candidate, attribute, breakdown, period and retrieval date: a correction is a new
        observation with its own retrieval date. Its `details` name the observation that stands:
        `value_id`, `candidate`, `attribute`, `data_source`, `breakdown_option` (only where it
        has one), `reference_period` (`start`, `end`) and `retrieval_date`. Of two submissions
        racing for one observation, the one whose figure was not stored is refused the same way.
        Resubmitting the same figure, whatever its quote or pages, returns the value already
        stored.
      operationId: enterValueManually
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ManualValueInput" } }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/Value" } }
        "409":
          description: >-
            The attribute does not permit manual entry, the value failed validation, or another
            figure is already on record for the same observation (`conflicting_observation`,
            with that observation's id and natural key in `details`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets:
    get:
      tags: [criteria]
      operationId: listCriteriaSets
      description: Live sets only. A deleted set is listed nowhere until it is restored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CriteriaSetListItem" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    post:
      tags: [criteria]
      operationId: createCriteriaSet
      description: |
        A new set is a **full copy of the default set** (`reqs.md` 3.4): every criterion with its
        weight, lock, rule, anchors and threshold, every pillar weight and lock at every level,
        and the rules the default turns on -- so it can be ranked wherever the default can. The
        default is the set the list marks `is_default`, and it is copied even after it has been
        deleted, when the list no longer shows it.
        409 `criteria_set_exists` when a set, live or deleted, already holds the `id` given: identifiers
        are never reused. 409 `criteria_set_name_taken` when a live set already has this name
        (`CriteriaSetName`). 409 `no_default_criteria_set` when no set is the default.
        409 `score_scale_below_anchors` when the default anchors a figure above the score range
        -- it was deleted before the range was lowered, say -- with `details` as
        `PUT /settings` gives them. A refused request writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { $ref: "#/components/schemas/NewCriteriaSetId" }
                name: { $ref: "#/components/schemas/CriteriaSetName" }
      responses:
        "201": { $ref: "#/components/responses/CriteriaSet" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}:
    get:
      tags: [criteria]
      operationId: getCriteriaSet
      description: |
        `level` narrows the criteria and the pillar weights together, never one without the
        other: weights sum to 100 within a level, so narrowing only the criteria would describe
        a set whose pillar weights summed to 200. A deleted set answers 404, as an unknown one
        does.
      parameters:
        - { $ref: "#/components/parameters/CriteriaSetId" }
        - { $ref: "#/components/parameters/LevelFilter" }
      responses:
        "200": { $ref: "#/components/responses/CriteriaSet" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    patch:
      tags: [criteria]
      operationId: renameCriteriaSet
      description: |
        409 `criteria_set_name_taken` when another live set has this name (`CriteriaSetName`);
        nothing is changed. 404 when no live set has this identifier.
      parameters: [ { $ref: "#/components/parameters/CriteriaSetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { $ref: "#/components/schemas/CriteriaSetName" } }
      responses:
        "200": { $ref: "#/components/responses/CriteriaSet" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    delete:
      tags: [criteria]
      operationId: deleteCriteriaSet
      description: |
        Deletes the set **restorably**. It leaves every list and every read at once, and nothing
        it holds is removed -- its criteria with their rules, anchors and thresholds, its locks,
        its pillar weights and the rules it turns on -- so
        `POST /criteria-sets/{criteriaSetId}/restore` brings it back exactly. Saved rankings
        computed with it stay readable, so they never stop a deletion. Its identifier stays
        taken. 404 when no live set has this identifier.
      parameters: [ { $ref: "#/components/parameters/CriteriaSetId" } ]
      responses:
        "204": { description: "Deleted, and restorable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}/restore:
    post:
      tags: [criteria]
      summary: Bring a deleted criteria set back exactly as it was
      description: |
        The way back from `DELETE /criteria-sets/{criteriaSetId}`: the set returns to every list
        and every read holding everything it held when it was deleted. Idempotent: a set that is
        not deleted is answered unchanged, because an identifier names one set for ever.
        409 `criteria_set_name_taken` when a live set has taken its name since it was deleted
        (`CriteriaSetName`); nothing is changed. 409 `score_scale_below_anchors` when the score
        range was lowered below one of its anchors while it was deleted, with `details` as
        `PUT /settings` gives them; it stays deleted. 404 when no set, live or deleted, has this
        identifier.
      operationId: restoreCriteriaSet
      parameters: [ { $ref: "#/components/parameters/CriteriaSetId" } ]
      responses:
        "200": { $ref: "#/components/responses/CriteriaSet" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}/duplicate:
    post:
      tags: [criteria]
      summary: Copy a criteria set
      description: |
        The safe way to experiment — a drag edits a set in place (`reqs.md` Q168). 404 when no
        live set has this identifier: a deleted set cannot be copied until it is restored.
        409 `criteria_set_exists` when a set, live or deleted, already holds the `id` given: identifiers
        are never reused. 409 `criteria_set_name_taken` when a live set already has this name
        (`CriteriaSetName`). 409 `score_scale_below_anchors` when the set anchors a figure above
        the score range, which only a migration can leave. A refused request writes nothing.
      operationId: duplicateCriteriaSet
      parameters: [ { $ref: "#/components/parameters/CriteriaSetId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { $ref: "#/components/schemas/NewCriteriaSetId" }
                name: { $ref: "#/components/schemas/CriteriaSetName" }
      responses:
        "201": { $ref: "#/components/responses/CriteriaSet" }
        "404": { $ref: "#/components/responses/NotFound" }
        # An identifier the caller chooses can already be taken. Refused rather
        # than overwritten: silently replacing a set somebody built loses the weights they
        # chose and says nothing (reqs.md Q191).
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}/criteria/{attributeId}:
    patch:
      tags: [criteria]
      summary: Adjust one criterion
      description: |
        Changing `weight` **rebalances the unlocked siblings within the pillar**, honouring locks,
        so the pillar always sums to 1. The response returns every criterion in that pillar with
        its new weight — the client sends one number and is told what the others became
        (`arch.md` 8.3).
      operationId: updateCriterion
      parameters:
        - { $ref: "#/components/parameters/CriteriaSetId" }
        - { $ref: "#/components/parameters/AttributeId" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CriterionInput" } }
      responses:
        "200":
          description: The affected pillar, rebalanced
          content:
            application/json:
              schema:
                type: object
                required: [pillar, criteria]
                properties:
                  pillar: { type: string }
                  criteria: { type: array, items: { $ref: "#/components/schemas/EvaluationCriterion" } }
        "409":
          description: >-
            `weights_all_locked`: the change cannot be made, and `details.reason` says why, with
            `details.locked` listing the locks in the way (possibly none).
            `moved_is_locked`: this weight is itself locked.
            `only_weight`: it is the only weight in its pillar, so nothing can absorb a change.
            `others_all_locked`: every other weight in the pillar is locked.
            `locks_leave_no_room`: the locked weights hold `details.held` between them, so this
            weight may ask for `details.at_most` and no more.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}/pillar-weights/{pillarId}:
    put:
      tags: [criteria]
      operationId: updatePillarWeight
      description: |
        Move a pillar's weight, lock it, or both — and neither field is required, because a
        lock has to be able to travel alone. A locked weight may not be moved *even to the
        value it already holds*, so a request carrying both could lock a pillar and never
        release it: the move is applied first and refused before the flag is read.
      parameters:
        - { $ref: "#/components/parameters/CriteriaSetId" }
        - { name: pillarId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight: { type: number, minimum: 0, maximum: 100, description: "Percentage, 0-100. Weights sum to 100 within a pillar, and pillar weights sum to 100 within a level. Omitted to change only the lock." }
                weight_locked: { type: boolean }
      responses:
        "200":
          description: All pillar weights for the level, rebalanced
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PillarWeight" } }
        "409":
          description: >-
            `weights_all_locked`, worded from `details.reason` and `details.locked` exactly as a
            criterion's weight is (`moved_is_locked`, `only_weight`, `others_all_locked`, or
            `locks_leave_no_room` with `held` and `at_most`), the weights here being the level's
            pillars.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}/match-rules/{matchRuleId}:
    put:
      tags: [criteria]
      summary: Whether this set enforces a gate
      operationId: setMatchRuleEnforcement
      parameters:
        - { $ref: "#/components/parameters/CriteriaSetId" }
        - { name: matchRuleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_enforced]
              properties: { is_enforced: { type: boolean } }
      responses:
        "204": { description: Updated }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /criteria-sets/{criteriaSetId}/compound-rules/{compoundRuleId}:
    put:
      tags: [criteria]
      summary: Whether this set applies a compound rule
      operationId: setCompoundRuleApplication
      parameters:
        - { $ref: "#/components/parameters/CriteriaSetId" }
        - { name: compoundRuleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_applied]
              properties: { is_applied: { type: boolean } }
      responses:
        "204": { description: Updated }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /match-rule-research/plan:
    post:
      tags: [rules]
      summary: What researching the gates would ask and cost, without asking
      description: |
        `reqs.md` 6.3. Research is the most expensive thing this application does -- one call per
        gate per candidate it concerns -- so the bill is shown before it is agreed to rather than
        after.

        **It counts the same pairs the pass would ask about**: only a gate the catalog marks
        researchable, and only about the candidates it concerns (`reqs.md` 7.3, Q236). A gate
        research cannot answer, a candidate the gate is not about, a gate asked only at another
        level, and one a human has already confirmed are in neither. Nothing is stored and
        nothing is charged.

        `estimate_basis` names the assumptions behind the euro figure. The output tokens and the
        searches per call are ceilings the client already imposes; the input tokens are
        configured, because the provider injects the pages it searched into the context and they
        cannot be derived from the prompt.
      operationId: planMatchRuleResearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string }
                match_rules:
                  type: [array, "null"]
                  items: { type: string }
                  description: Null means every gate asked at the level.
                candidates:
                  type: [array, "null"]
                  items: { type: string }
                  description: Null means every candidate at the level.
                accept_uncapped_spend: { type: boolean, default: false, description: Ignored here; an estimate spends nothing. }
      responses:
        "200":
          description: What a pass would ask, and what it would cost at most
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchPlan" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "501":
          description: No model is configured, so there is nothing to estimate.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /match-rule-research:
    post:
      tags: [rules]
      summary: Ask a model to research the gates nobody has confirmed
      description: |
        `reqs.md` 6.10 use 3. For every researchable gate in scope, about each candidate it
        concerns, that no human has answered, a model reads the official pages and **proposes** a
        result with the pages it read (Q236). A gate research cannot answer asks nothing and costs
        nothing. A proposal rules nothing out: it is displayed with its sources, and confirming it
        means writing the same answer through `putMatchRuleResult`, which replaces it.

        **This costs money**, so the spend cap applies exactly as it does to a run: refused when
        no cap is set unless `accept_uncapped_spend` says otherwise, and it stops at the cap
        keeping every proposal already found. A scope that would ask nothing needs no cap. Every
        billed call is written to a spend ledger as it returns, which nothing here reads back.
      operationId: researchMatchRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string }
                match_rules:
                  type: [array, "null"]
                  items: { type: string }
                  description: Null means every gate asked at the level.
                candidates:
                  type: [array, "null"]
                  items: { type: string }
                  description: Null means every candidate at the level.
                accept_uncapped_spend: { type: boolean, default: false }
      responses:
        "200":
          description: What it proposed, and what it cost
          content:
            application/json:
              schema:
                type: object
                required: [proposals, cost_eur, calls, halted_on_spend_cap]
                properties:
                  proposals:
                    type: array
                    items: { $ref: "#/components/schemas/MatchRuleResult" }
                  refusals:
                    type: array
                    description: "Gates asked whose answer was not stored: the model cited nothing (or could not be reached), or a person answered the gate while the pass ran (NEW-63). Each line names the gate and the candidate as the catalog names them, never by id (PL-150), and gives its reason."
                    items: { type: string }
                  cost_eur: { type: number }
                  calls: { type: integer }
                  halted_on_spend_cap: { type: boolean }
        "409":
          description: The research would cost money and no spend cap is set.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "501":
          description: No model is configured, so nothing can be researched.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /match-rules:
    get:
      tags: [rules]
      operationId: listMatchRules
      parameters: [ { $ref: "#/components/parameters/LevelFilter" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MatchRule" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /match-rule-results:
    get:
      tags: [rules]
      operationId: listMatchRuleResults
      parameters:
        - { name: candidate, in: query, schema: { type: string } }
        - { name: match_rule, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MatchRuleResult" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /match-rule-results/{matchRuleId}/{candidateId}:
    put:
      tags: [rules]
      summary: Record or override a gate's answer
      description: |
        Also how a candidate is ruled out by hand — the `not_manually_excluded` rule with a
        reason (`reqs.md` Q152). An override is audited and travels with the candidate.
      operationId: putMatchRuleResult
      parameters:
        - { name: matchRuleId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CandidateId" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MatchRuleResultInput" } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/MatchRuleResult" } }
        "409":
          description: >-
            `answer_recorded_by_a_person` -- the answer comes from a model, and a person has
            already answered this gate for this candidate. A model's answer is a proposal and
            never replaces a person's (reqs.md 6.10 use 3), so nothing is stored; send it as
            `manual` to replace the person's answer. The message names the gate and the
            candidate; `details.match_rule` and `details.candidate` carry their ids (PL-150).
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /compound-rules:
    get:
      tags: [rules]
      operationId: listCompoundRules
      parameters: [ { $ref: "#/components/parameters/LevelFilter" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CompoundRule" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-acquisition-runs:
    get:
      tags: [data acquisition]
      operationId: listRuns
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  total: { type: integer }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    post:
      tags: [data acquisition]
      summary: Start a run
      description: Returns immediately; the work happens in the background. Poll the run.
      operationId: startRun
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RunRequest" } }
      responses:
        "202":
          description: Accepted
          content:
            application/json: { schema: { $ref: "#/components/schemas/Run" } }
        "409":
          description: |
            Two refusals share this status and are told apart by `code`.

            `spend_cap_not_set` — the run would ask a source that charges and no spend cap is
            set. Set `run_spend_cap_eur`, or send `accept_uncapped_spend: true` to accept an
            uncapped run; nothing invents a ceiling on the household's behalf (`reqs.md` 6.3).

            `run_already_in_flight` — a run is already going, and one household runs one pass
            at a time (`reqs.md` 10). The message names the run: poll it rather than starting
            another. This is what stops a client timeout, which is indistinguishable from a
            failure, from being retried into a second concurrent run.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-acquisition-runs/plan:
    post:
      tags: [data acquisition]
      summary: Estimate a run without executing it
      description: |
        The dry run of `reqs.md` 6.3 — planned work and estimated cost, for confirmation before
        anything is fetched or spent. Has no side effects despite being a POST, because the
        scope is a body rather than a query.
      operationId: planRun
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RunScope" } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/RunPlan" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-acquisition-runs/{runId}:
    get:
      tags: [data acquisition]
      summary: A run, with live progress
      operationId: getRun
      parameters: [ { name: runId, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/RunDetail" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-acquisition-runs/{runId}/stop:
    post:
      tags: [acquisition]
      summary: Stop a run, keeping everything it completed
      description: |
        **Nothing is lost.** The acquisition loop reads the request between sources, so every
        figure already written stays written — the same guarantee the spend cap gives.

        **It takes effect when the source in flight finishes.** A source's fetch is one request
        over every candidate in most adapters, so that is the finest grain at which a run can be
        interrupted without abandoning a request the publisher has already answered.

        The run ends `halted_by_user`, which is neither `halted_on_spend_cap` (the money ran
        out) nor `failed` (it broke). Recording it as either would make the history lie about
        why the figures stop where they do.

        Asking a run that has already finished to stop is not an error — the outcome asked for
        is already true — and it leaves no trace on that run.
      operationId: stopRun
      parameters: [ { name: runId, in: path, required: true, schema: { type: integer } } ]
      responses:
        "202":
          description: The request was recorded. The run stops at its next source.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Run" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /data-acquisition-runs/{runId}/retry:
    post:
      tags: [data acquisition]
      summary: Run again over part of a run's scope
      description: |
        Creates a **new** run over part of the run named, which keeps its own record either way.

        `items: failed` (the default) asks only the sources that failed, only about the
        attributes each failed on, across the candidates that failed. Its scope is the smallest
        covering the failures -- every failed candidate against every failed attribute -- because
        the scope is recorded as two lists, and every pair in it is asked of at least one source.

        `items: unanswered` asks again about the items that produced neither a figure nor a
        failure. There is no source to narrow to, because no source failed: every source that
        can answer those attributes is asked. For a country a dataset simply does not cover this
        will change nothing, which is why it is a separate request rather than part of a retry.
      operationId: retryRun
      parameters: [ { name: runId, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: string
                  enum: [failed, unanswered]
                  default: failed
                accept_uncapped_spend:
                  type: boolean
                  default: false
                  description: >-
                    Agreement to a retry that can spend with no ceiling, for this request only.
                    A retry asks the sources that failed, which is where a paid source is most
                    likely to be, so it takes the same acceptance a first run takes rather than
                    inheriting the one already given.
      responses:
        "202":
          description: Accepted
          content:
            application/json: { schema: { $ref: "#/components/schemas/Run" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The run has nothing of that kind, so the new run would be a no-op -- or the retry
            would reach a source that charges and no spend cap is set (`spend_cap_not_set`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /holdings:
    get:
      tags: [data acquisition]
      summary: What the database holds at a level, and what this month has cost
      description: |
        Database facts rather than one run's accounting: the values stored, how many have aged
        past what their attribute allows, the month's spend over runs and gate research, and the
        gaps, each with the latest acquisition that asked about it. Computed in one read, so the
        figures and the gaps always add up: values_stored plus the three gap lists equals
        pairs_total.
      operationId: getHoldings
      parameters:
        - { name: level, in: query, required: true, schema: { type: string } }
        - name: since
          in: query
          required: true
          description: The start of "this month" as the reader's clock has it. Spend recorded at or after it is summed.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/Holdings" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /rankings:
    get:
      tags: [evaluation]
      summary: Compute a ranking
      description: |
        **Computes and returns; stores nothing.** This is how "adjusting a weight recalculates
        instantly" works over HTTP (`reqs.md` 5.6, Q155). To keep a result, `POST /evaluations`.
      operationId: getRanking
      parameters:
        - { name: criteria_set, in: query, required: true, schema: { type: string } }
        - { name: level, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ranking" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`score_scale_not_set`: there is no top of the score range to score onto."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /rankings/candidates/{candidateId}:
    get:
      tags: [evaluation]
      summary: Why this candidate scores what it scores, in the live ranking
      description: |
        The drill-down for a ranking nobody saved. `getCandidateScoreDetail` answers the same
        question of a saved evaluation and takes its id; a ranking computed on the fly has none,
        so without this the numbers behind a score on screen could be reached only by saving the
        ranking first — a decision about what to keep, not a step in reading it.

        **Computes and returns; stores nothing**, like the ranking it drills into. It scores the
        whole level rather than the one candidate, because redistribution and the score scale
        are properties of the pass and not of the row.
      operationId: getRankedCandidateDetail
      parameters:
        - { $ref: "#/components/parameters/CandidateId" }
        - { name: criteria_set, in: query, required: true, schema: { type: string } }
        - { name: level, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/CandidateScoreDetail" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`score_scale_not_set`: there is no top of the score range to score onto."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /evaluations:
    get:
      tags: [evaluation]
      operationId: listEvaluations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvaluationSummary" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    post:
      tags: [evaluation]
      summary: Keep a ranking
      description: |
        Persists the ranking **with a frozen copy of the criteria used** and the per-attribute
        detail behind every score, so it reads the same later however the criteria set or the
        scoring code change (`reqs.md` 3.4a, Q156).
      operationId: saveEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [criteria_set, level]
              properties:
                criteria_set: { type: string }
                level: { type: string }
                note: { type: string, description: Why this one was kept }
      responses:
        "201":
          description: Created
          content:
            application/json: { schema: { $ref: "#/components/schemas/EvaluationSummary" } }
        "409":
          description: "`score_scale_not_set`: there is no top of the score range to score onto."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /evaluations/{evaluationId}:
    get:
      tags: [evaluation]
      operationId: getEvaluation
      parameters: [ { $ref: "#/components/parameters/EvaluationId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ranking" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    delete:
      tags: [evaluation]
      summary: Discard a kept ranking
      description: |
        Deletes the ranking with its whole tree -- the frozen criteria, the results, every
        contribution, refusal and warning and the evidence links they hold (D47). The values and
        gate answers it cited stay: they belong to the candidate, not to the ranking. Once
        discarded it cannot be brought back, and the criteria set it was computed from is no
        longer held by it.
      operationId: deleteEvaluation
      parameters: [ { $ref: "#/components/parameters/EvaluationId" } ]
      responses:
        "204": { description: Discarded }
        "404":
          description: "`not_found`: nobody kept an evaluation with this id. `details.evaluation` names it."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /evaluations/{evaluationId}/candidates/{candidateId}:
    get:
      tags: [evaluation]
      summary: Why this candidate scored what it scored
      description: |
        The drill-down. Every attribute's normalised score, its effective weight after
        redistribution, its contribution, and **the exact value used**, with that value's source
        and dates. This is the provenance chain end to end.

        A refusal carries the gate answer or the figure it read, and a warning its inputs, as
        they were when the ranking was saved (D46). A ranking saved before its evidence was kept
        serves none: a null gate answer and empty inputs.

        **`delta_vs_home` is taken against the household's current home country.** A saved
        ranking freezes its criteria and its score scale but not the household, so the
        difference is between saved scores, anchored on today's home.
      operationId: getCandidateScoreDetail
      parameters:
        - { $ref: "#/components/parameters/EvaluationId" }
        - { $ref: "#/components/parameters/CandidateId" }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/CandidateScoreDetail" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /evaluations/{evaluationId}/criteria:
    get:
      tags: [evaluation]
      summary: The criteria this evaluation was computed with
      description: |
        The frozen snapshot (`reqs.md` 3.4a). The criteria set it names stays editable, so this
        is the only record of what the weights actually were when the ranking was produced — and
        which attributes were in scope, which is what keeps its coverage figure meaningful.
      operationId: getEvaluationCriteria
      parameters: [ { $ref: "#/components/parameters/EvaluationId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pillar_weights, criteria]
                properties:
                  pillar_weights: { type: array, items: { $ref: "#/components/schemas/EvaluationPillarWeight" } }
                  criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /comparisons:
    get:
      tags: [evaluation]
      summary: A focus candidate against comparators
      description: >-
        Levels are never mixed. The comparator limit comes from settings. Every gap and every
        worth in the answer reads comparator minus focus: positive where the comparator is
        ahead, as the matrix draws it. Comparators come back in the order they were asked for.
      operationId: getComparison
      parameters:
        - { name: criteria_set, in: query, required: true, schema: { type: string } }
        - { name: level, in: query, required: true, schema: { type: string } }
        - { name: focus, in: query, required: true, schema: { type: string } }
        - name: comparators
          in: query
          required: true
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/Comparison" } }
        "409":
          description: >-
            `comparator_limit_not_set`; `comparator_limit_exceeded` (`details.limit`,
            `details.asked`); `invalid_comparison` (`details.candidates`: the ids it concerns);
            or `score_scale_not_set`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /external-scores:
    get:
      tags: [values]
      summary: Published scores from outside indices
      description: |
        Displayed **beside** the score, never fed into it (`reqs.md` 3.5a).
      operationId: listExternalScores
      parameters: [ { name: candidate, in: query, schema: { type: string } } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExternalScore" } }
        "422": { $ref: "#/components/responses/InvalidRequest" }

components:

  parameters:
    LevelFilter: { name: level, in: query, schema: { type: string }, description: "`country` or `city`" }
    AttributeId: { name: attributeId, in: path, required: true, schema: { type: string }, description: "e.g. `country.cost_of_living_index`" }
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string }, description: "e.g. `country.portugal`" }
    CriteriaSetId: { name: criteriaSetId, in: path, required: true, schema: { type: string } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: integer } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }

  responses:
    Household:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Household" } } }
    Settings:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } }
    CriteriaSet:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/CriteriaSet" } } }
    InvalidRequest:
      # Every operation declares this, because every operation can answer it: a query parameter
      # the operation does not declare is refused wherever it is sent (BE-23). A malformed
      # request has always been a 422 here, never a 400 -- the household kept it (2026-10-14).
      description: >-
        The request is malformed, or names something the domain will not accept; `code` says
        which. `invalid_request` is a malformed request -- a body field or query parameter the
        operation does not declare, a value of the wrong type or out of range, a null the field
        refuses, an identifier that cannot be one -- and each entry of `details.errors` says
        where (`location`), what (`kind`, with `limit` where a bound refused it) and, for a
        developer, why (`problem`). Any other code is the domain's own refusal, such as
        `invalid_criterion`, `unknown_place` or `unknown_scope`. `cannot_be_ranked` names its
        cause in `details.reason` where it is one of four: `scores_nothing`, no criterion is
        scored at the level; `pillar_without_criteria`, pillars carry weight that no criterion
        scores into; `criteria_without_weight`, the criteria still scored in a pillar carry no
        weight between them; or `pillars_without_weight`, the pillars still scored carry no
        weight between them. All but the first list their pillars in `details.pillars`.
        `invalid_criterion` raised against
        the score range carries `details.reason: anchor_above_scale`, with the `attribute`, its
        `anchor_score` and the `score_scale_max` it is above. A domain refusal about request
        fields -- `invalid_criterion` -- lists them the same way in `details.errors`, one entry
        per field of the rule it refused (`location` `[body, target_range_max]`, say), with
        `kind: invalid_criterion`, the domain's sentence as `problem`, and `limit` where a bound
        refused it.
      content: { application/json: { schema: { $ref: "#/components/schemas/InvalidRequestError" } } }
    NotFound:
      description: No such resource.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: A domain invariant would be violated.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode", description: "Stable and machine-readable. Branch on this, never on the message." }
        message: { type: string }
        details: { type: object, additionalProperties: true }
      examples:
        - { code: weights_all_locked, message: "Every other weight in this pillar is locked.", details: { reason: others_all_locked, locked: ["country.total_tax_rate_effective"] } }

    InvalidRequestError:
      description: >-
        The `Error` a 422 answers with. `details` stays open, because a domain refusal carries
        its own fields there; a malformed request, or a refused rule, lists its fields in
        `details.errors`.
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          properties:
            details:
              type: object
              additionalProperties: true
              properties:
                errors:
                  type: array
                  items: { $ref: "#/components/schemas/FieldProblem" }

    FieldProblem:
      type: object
      required: [location, problem, kind]
      properties:
        location: { type: array, items: { type: string }, description: "Where the offending value is, e.g. [body, comparator_limit], [body, scale_anchors, '0', score] or [query, level]." }
        problem: { type: string, description: "The validator's or the domain's own sentence, for a developer. A form words the refusal from kind and limit." }
        kind: { type: string, description: "Stable. The validator's error type (less_than_equal, greater_than_equal, greater_than, int_from_float, int_parsing, float_parsing, finite_number, missing, extra_forbidden, and so on) or invalid_criterion." }
        limit: { type: number, description: "The bound that refused the value, present only where kind names a numeric bound." }

    ErrorCode:
      type: string
      description: >-
        Every refusal this API makes, by code. A client words each one and branches on it;
        `message` is for a person reading the API directly and may change.
      enum:
        - not_found
        - candidate_not_found
        - household_not_configured
        - weights_all_locked
        - criteria_set_exists
        - criteria_set_name_taken
        - no_default_criteria_set
        - nothing_to_retry
        - nothing_to_ask_again
        - spend_cap_not_set
        - nothing_to_fetch
        - run_already_in_flight
        - llm_not_configured
        - manual_entry_not_permitted
        - invalid_value
        - conflicting_observation
        - answer_recorded_by_a_person
        - score_scale_not_set
        - score_scale_below_anchors
        - comparator_limit_not_set
        - comparator_limit_exceeded
        - invalid_comparison
        - invalid_criteria_set
        - invalid_criterion
        - unknown_place
        - invalid_reference_period
        - invalid_request
        - cannot_be_scored
        - cannot_be_ranked
        - invalid_match_rule_result
        - unknown_data_source
        - unknown_scope
        - invalid_source_order

    ReferencePeriod:
      type: object
      description: The span the data describes. Start equals end for a single day.
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }

    FxRate:
      type: object
      required: [rate, rate_date, data_source]
      properties:
        rate: { type: number }
        rate_date: { type: string, format: date }
        data_source: { type: string }

    Level:
      type: object
      required: [id, depth_order]
      properties:
        id: { type: string }
        depth_order: { type: integer }
        parent_level: { type: [string, "null"] }

    Pillar:
      type: object
      required: [id, name, display_order]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        display_order:
          type: integer
          minimum: 1
          description: >-
            Where this pillar sits in the sequence the eleven are read in -- left to right
            across the Rank table, top to bottom in Configure. A fact about the catalog rather
            than a list in a client, so adding a pillar is still a data change.


    ValueTypeName:
      type: string
      enum: [Monetary, Quantity, Count, Ratio, Index, LabelSet, ShareComposition, Boolean, AssignedScore, Text]

    Attribute:
      type: object
      required: [id, name, level, value_type, answerable_by]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        level: { type: string }
        pillar: { type: [string, "null"], description: "Null for descriptive attributes, which are never scored." }
        value_type: { $ref: "#/components/schemas/ValueTypeName" }
        unit: { type: [string, "null"] }
        # Months, not days: that is the unit reqs.md 7.1 declares and the unit the column
        # stores. An interval of two years is 730.5 days, which an integer day count cannot
        # say (known-issues D18). Null means never stale.
        max_age_months: { type: [integer, "null"], description: "How stale a figure may be before a fresher one outranks it, in whole months. Null means never." }
        manual_entry: { type: boolean, description: "Whether a value may be typed by hand for this attribute." }
        breakdown_scheme: { type: [string, "null"] }
        breakdown_options: { type: array, items: { type: string } }
        allowed_range:
          description: "Per-attribute validation beyond what the value type enforces. Null when none is declared."
          oneOf:
            - type: "null"
            - type: object
              properties:
                min_value: { type: [number, "null"] }
                max_value: { type: [number, "null"] }
        allowed_labels:
          type: array
          description: "The controlled vocabulary a LabelSet may draw from. Empty when unconstrained."
          items: { type: string }
        effective_source_priority:
          type: array
          description: >-
            The order sources are consulted for this attribute, highest first: the
            attribute's own overrides, then every other source in the global order beneath
            them. Resolved on the server so no client reimplements the rule.
          items: { type: string }
        answerable_by:
          type: array
          description: >-
            The sources whose registered adapter can fetch this attribute, in the order of
            `effective_source_priority`, each once (reqs.md Q235). Whether a source is switched
            on does not enter into it: that is a judgement about consulting it, not a fact about
            what it can fetch. Empty means no run can fetch it -- `manual` and `stand_in` are not
            adapters, and `llm` appears only where an LLM adapter is configured and declares it.
          items: { type: string }

    DataSource:
      type: object
      required: [id, name, source_kind, default_priority, reliability_tier]
      properties:
        id: { type: string }
        name: { type: string }
        source_kind: { type: string, enum: [structured, llm, manual] }
        default_priority: { type: integer }
        reliability_tier: { type: string }
        is_enabled:
          type: boolean
          default: true
          description: >
            Whether this source is consulted. False means a run does not ask it and its stored
            values are not scored -- the values are kept and stay visible, because selecting an
            active value never discards data (reqs.md 3.6).

    Candidate:
      type: object
      required: [id, name, level]
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: string }
        parent_candidate: { type: [string, "null"] }
        country_code:
          type: [string, "null"]
          description: >-
            ISO 3166-1 alpha-2, where the candidate is a country or belongs to one. Stored in
            the catalog rather than derived from the name: a display that maps names to codes
            in the client would be a second, drifting copy of a thing the database already
            holds, and would be wrong for every candidate whose name is not a country's.

    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/Candidate"
        - type: object
          properties:
            descriptive_values:
              type: array
              description: Attributes with no criterion — population, timezone, coastline.
              items: { $ref: "#/components/schemas/Value" }

    MonetaryPayload:
      type: object
      required: [amount, currency, amount_eur]
      properties:
        amount: { type: number }
        currency: { type: string, description: ISO 4217 }
        amount_eur: { type: number }
        fx_rate: { $ref: "#/components/schemas/FxRate" }
    QuantityPayload:
      type: object
      required: [magnitude, unit]
      properties: { magnitude: { type: number }, unit: { type: string } }
    CountPayload:
      type: object
      required: [count]
      properties: { count: { type: integer }, basis: { type: [string, "null"] } }
    RatioPayload:
      type: object
      # `basis` is required (D19). The column is NOT NULL and `payloads.py` says why in words:
      # a bare "23.4%" is not a measurement, because 23.4% of the workforce and 23.4% of the
      # land area are different facts and only the basis tells them apart.
      required: [value, basis]
      properties: { value: { type: number }, basis: { type: string } }
    IndexPayload:
      type: object
      required: [value, provider, scale_min, scale_max]
      properties:
        value: { type: number }
        provider: { type: string }
        scale_min: { type: number }
        scale_max: { type: number }
    LabelSetPayload:
      type: object
      required: [labels]
      properties: { labels: { type: array, items: { type: string } } }
    ShareCompositionPayload:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items:
            type: object
            required: [label, share]
            properties: { label: { type: string }, share: { type: number } }
    BooleanPayload:
      type: object
      required: [value]
      properties: { value: { type: boolean } }
    AssignedScorePayload:
      type: object
      required: [value, range_min, range_max, assigned_by]
      properties:
        value: { type: number }
        range_min: { type: number }
        range_max: { type: number }
        assigned_by: { type: string, enum: [llm, human] }
        rationale: { type: string }
    TextPayload:
      type: object
      required: [body]
      properties: { body: { type: string } }

    Value:
      type: object
      description: |
        One measurement, with its provenance. `value_type` selects which variant `payload` holds.
      required: [id, candidate, attribute, value_type, payload, data_source, reference_period, retrieval_date, confidence_level, is_active, is_fresh, source_is_enabled]
      properties:
        id: { type: integer }
        candidate: { type: string }
        attribute: { type: string }
        breakdown_option: { type: [string, "null"] }
        value_type: { $ref: "#/components/schemas/ValueTypeName" }
        payload:
          oneOf:
            - $ref: "#/components/schemas/MonetaryPayload"
            - $ref: "#/components/schemas/QuantityPayload"
            - $ref: "#/components/schemas/CountPayload"
            - $ref: "#/components/schemas/RatioPayload"
            - $ref: "#/components/schemas/IndexPayload"
            - $ref: "#/components/schemas/LabelSetPayload"
            - $ref: "#/components/schemas/ShareCompositionPayload"
            - $ref: "#/components/schemas/BooleanPayload"
            - $ref: "#/components/schemas/AssignedScorePayload"
            - $ref: "#/components/schemas/TextPayload"
        data_source: { type: string }
        reference_period: { $ref: "#/components/schemas/ReferencePeriod" }
        retrieval_date: { type: string, format: date-time }
        confidence_level: { type: string, enum: [absolute, high, medium, low] }
        is_active: { type: boolean, description: "Derived, not stored — the value scoring would use." }
        is_fresh:
          type: boolean
          description: >-
            Derived, not stored: whether the period this figure describes ended within its
            attribute's max_age of today, by the calendar arithmetic the active-value rule uses
            (reqs.md 3.6, 7.1). A figure that is not fresh counts one confidence grade lower in a
            ranking's coverage_by_confidence (reqs.md 5.7); confidence_level stays the grade it
            was stored with.
        source_is_enabled:
          type: boolean
          description: >-
            Derived, not stored: whether this figure's source is switched on. A figure from a
            switched-off source is never active, and is kept and shown (reqs.md Q232).
        rejection_reason: { type: [string, "null"], description: "Why this figure was rejected, in words: the attribute named as the catalog names it, never its identifier. A reason stored before reasons were worded is named at read time." }
        quote: { type: [string, "null"] }
        citations: { type: array, items: { type: string, format: uri } }
        data_acquisition_run: { type: [integer, "null"] }

    ManualValueInput:
      type: object
      description: "The source is implicitly `manual`; it cannot be set to anything else here."
      required: [candidate, attribute, payload, reference_period, retrieval_date]
      properties:
        candidate: { type: string }
        attribute: { type: string }
        breakdown_option: { type: [string, "null"] }
        payload:
          description: "Must match the attribute's declared value type, or the request is rejected."
          oneOf:
            - $ref: "#/components/schemas/MonetaryPayload"
            - $ref: "#/components/schemas/QuantityPayload"
            - $ref: "#/components/schemas/CountPayload"
            - $ref: "#/components/schemas/RatioPayload"
            - $ref: "#/components/schemas/IndexPayload"
            - $ref: "#/components/schemas/LabelSetPayload"
            - $ref: "#/components/schemas/ShareCompositionPayload"
            - $ref: "#/components/schemas/BooleanPayload"
            - $ref: "#/components/schemas/AssignedScorePayload"
            - $ref: "#/components/schemas/TextPayload"
        reference_period: { $ref: "#/components/schemas/ReferencePeriod" }
        retrieval_date: { type: string, format: date-time }
        confidence_level:
          type: string
          enum: [absolute, high, medium, low]
          default: medium
          description: "Defaults to a deliberately unflattering middle; a source tier says nothing useful about a typed value (`reqs.md` 5.7)."
        quote: { type: [string, "null"], description: "Where this came from, in words." }
        citations: { type: array, items: { type: string, format: uri } }

    HouseholdInput:
      type: object
      required: [net_income, number_adults, number_children, home_country_candidate, citizenships]
      properties:
        net_income: { type: number, minimum: 0 }
        number_adults: { type: integer, minimum: 1 }
        number_children: { type: integer, minimum: 0, description: Under 18. }
        target_monthly_spend: { type: number, minimum: 0 }
        max_rent: { type: number, minimum: 0 }
        home_country_candidate: { type: string }
        home_city_candidate: { type: [string, "null"] }
        citizenships:
          type: array
          minItems: 1
          description: >-
            Candidate ids of countries. At least one is required: eu_free_movement and the UK
            and Swiss gates all turn on it (reqs.md 7.3), and an empty set would make every
            such gate pass or fail silently rather than visibly.
          items: { type: string }
    Household:
      allOf: [ { $ref: "#/components/schemas/HouseholdInput" } ]

    SettingsInput:
      type: object
      # Every one of these may be null, and null is the shipped state: the documents propose
      # values and the household chooses them (reqs.md 3.10), so an unset setting is a decision
      # not yet made rather than a fault. A ranking refuses to compute until the score scale is
      # set instead of assuming 100 (devplan.md 0.3), which only works if "unset" is expressible.
      properties:
        min_coverage: { type: [number, "null"], minimum: 0, maximum: 100, description: "Percentage, 0-100. Below this a candidate is insufficient_data rather than scored." }
        score_scale_max: { type: [integer, "null"], minimum: 1 }
        comparator_limit: { type: [integer, "null"], minimum: 1, maximum: 20, description: "How many comparators one comparison may hold, 1 to 20. Twenty is the product's ceiling (design DECISIONS, 2026-09-20), held by the database too." }
        run_spend_cap_eur: { type: [number, "null"], minimum: 0 }
        refetch_older_than_days:
          type: [integer, "null"]
          minimum: 1
          description: >
            How old a figure must be before a run asks about it again. Null refetches
            everything, which is the shipped state. Governs re-fetching only -- which stored
            figure scores is the attribute's own max_age (reqs.md 7.1), because one number
            cannot sensibly govern staleness for climate and for rent alike.
    Settings:
      allOf: [ { $ref: "#/components/schemas/SettingsInput" } ]

    CriterionInput:
      type: object
      description: Only the fields present are changed.
      properties:
        is_scored: { type: boolean }
        weight: { type: number, minimum: 0, maximum: 100, description: "Percentage, 0-100. Weights sum to 100 within a pillar, and pillar weights sum to 100 within a level." }
        weight_locked: { type: boolean }
        goal: { type: string, enum: [minimise, maximise, target_range] }
        target_range_min: { type: [number, "null"] }
        target_range_max: { type: [number, "null"] }
        zero_score_below: { type: [number, "null"] }
        zero_score_above: { type: [number, "null"] }
        normalisation_method: { type: string, enum: [fixed, percentile, as_is] }
        blocks_if_missing: { type: boolean }
        breakdown_option: { type: [string, "null"] }
        reducer_mode: { type: string, enum: [select, aggregate], description: "Omit when the attribute has no breakdown." }
        scale_anchors:
          type: array
          description: "For the `fixed` method. A label lets a number display as a word without ceasing to be a number (`reqs.md` 5.1)."
          items:
            type: object
            required: [input_value, score]
            properties:
              input_value: { type: number }
              score: { type: integer }
              label: { type: [string, "null"], description: "e.g. affordable, stretching" }
        matching_threshold:
          description: Shape depends on the attribute's value type. Null clears it.
          oneOf:
            - type: "null"
            - type: object
              properties: { min_value: { type: [number, "null"] }, max_value: { type: [number, "null"] } }
            - type: object
              properties:
                labels:
                  type: array
                  items:
                    type: object
                    required: [label, containment_rule]
                    properties:
                      label: { type: string }
                      containment_rule: { type: string, enum: [must_contain, must_not_contain] }
            - type: object
              properties: { required_value: { type: boolean } }
            - type: object
              description: "For ShareComposition: a bound on one named label's share."
              properties:
                label: { type: string }
                min_share: { type: [number, "null"] }
                max_share: { type: [number, "null"] }

    Criterion:
      # A stored criterion always carries these: `CriterionInput` leaves them optional because
      # a PATCH changes only what it names, while a criterion that has been *read* has a goal,
      # a method and a weight whether anybody sent them or not. Typing them optional here made
      # every client defend against an absence the server cannot produce.
      allOf:
        - $ref: "#/components/schemas/CriterionInput"
        - type: object
          required: [attribute, pillar, is_scored, weight, weight_locked, goal, normalisation_method, blocks_if_missing]
          properties:
            attribute: { type: string }
            pillar: { type: string }

    EvaluationCriterion:
      description: >-
        A criterion as it stood when an evaluation ran, not as it stands now. The criteria set
        it was copied from stays editable, so this is the only record of the interpretation
        that produced the scores (reqs.md 3.4a, Q193).
      allOf:
        - $ref: "#/components/schemas/Criterion"
        - type: object
          properties:
            scale_anchors:
              type: array
              description: >-
                The anchors frozen at the moment the evaluation ran, label included --
                re-reading an old evaluation must show the words it showed then.
              items:
                type: object
                properties:
                  input_value: { type: number }
                  # No maximum. The ceiling is the evaluation's own frozen score_scale_max,
                  # which is a setting the user edits, so it cannot be stated here as a
                  # constant. Migration 0107 enforces it per evaluation.
                  score: { type: integer, minimum: 0 }
                  label:
                    type: [string, "null"]
                    description: The word this band displays as, from this anchor up to the next.

    PillarWeight:
      type: object
      required: [pillar, level, weight, weight_locked]
      properties:
        pillar: { type: string }
        level: { type: string, description: "A set weighs a pillar once per level, and the two sum to 100 independently (reqs.md Q187)." }
        weight: { type: number, minimum: 0, maximum: 100, description: "Percentage, 0-100. Pillar weights sum to 100 within a level." }
        weight_locked: { type: boolean }

    EvaluationPillarWeight:
      # A frozen evaluation's pillar weight names no level: the evaluation ran at one level,
      # recorded on the evaluation itself, and never spans two (reqs.md 3.4a). The same split
      # the code makes with EvaluationPillarWeightBody, and the same one EvaluationCriterion
      # makes for a frozen criterion.
      type: object
      required: [pillar, weight, weight_locked]
      properties:
        pillar: { type: string }
        weight: { type: number, minimum: 0, maximum: 100, description: "Percentage, 0-100. Pillar weights sum to 100 within the evaluation's level." }
        weight_locked: { type: boolean }

    # Requests only. A response's `name` stays a plain string, because a name stored before the
    # cap existed must still read.
    CriteriaSetName:
      type: string
      minLength: 1
      maxLength: 60
      pattern: "\\S"
      description: |
        A criteria set's name: not blank, at most 60 characters, and trimmed of surrounding
        spaces when stored. Unique among live sets, ignoring case and surrounding spaces: a name
        another live set has is refused with 409 `criteria_set_name_taken`, naming it in
        `details.name`. A deleted set's name is free: a live set may take it, and the deleted
        set's restore is then refused.

    NewCriteriaSetId:
      type: string
      examples: ["partner"]
      description: |
        Optional. Left out, the server derives it from the name, once and never again: accents
        stripped, lower case, every run of anything else one underscore, prefixed `set_` when
        nothing is left or it starts with a digit -- "Zürich" gives `zurich`, "2026 plan"
        `set_2026_plan`, "Ελλάδα" `set` -- and the first of `<stem>`, `<stem>_2`, `<stem>_3`...
        that no set, live or deleted, has ever held. Given, it is used as it is, and refused with
        409 `criteria_set_exists` when a set, live or deleted, holds it.

    CriteriaSetSummary:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }

    CriteriaSetListItem:
      description: A live set, as the list gives it.
      allOf:
        - $ref: "#/components/schemas/CriteriaSetSummary"
        - type: object
          # `is_default` is deliberately not required yet: the server does not send it, and every
          # served list is validated against this schema (`test_contract_conformance.py`). It
          # becomes required in the commit that serves it.
          required: [heaviest_pillars]
          properties:
            is_default:
              type: boolean
              description: "The set a new one is copied from (`reqs.md` 3.4). At most one set is the default."
            heaviest_pillars:
              type: array
              description: |
                One entry per level the set weighs pillars at: the pillar with the largest weight
                there, a tie going to the lower `display_order`. Empty for a set that weighs no
                pillar.
              items:
                type: object
                required: [level, pillar, weight]
                properties:
                  level: { type: string }
                  pillar: { type: string }
                  weight: { type: number, minimum: 0, maximum: 100, description: "Percentage, 0-100, as PillarWeight gives it." }

    CriteriaSet:
      allOf:
        - $ref: "#/components/schemas/CriteriaSetSummary"
        - type: object
          properties:
            pillar_weights: { type: array, items: { $ref: "#/components/schemas/PillarWeight" } }
            criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
            enforced_match_rules: { type: array, items: { type: string } }
            applied_compound_rules: { type: array, items: { type: string } }

    MatchRule:
      type: object
      required: [id, name, level, description]
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: [string, "null"], description: "Null for a gate asked at every level, such as not_manually_excluded." }
        description:
          type: string
          description: >-
            When a candidate matches this gate, in words: catalog data seeded from reqs.md 7.3's
            "Matches when" column, never an identifier.

    MatchRuleResultInput:
      type: object
      required: [match_result]
      properties:
        match_result: { type: string, enum: [matching, not_matching, unknown] }
        reason: { type: [string, "null"] }
        data_source: { type: string, default: manual }
        reference_period:
          description: "What period the answer holds for. Null where nobody recorded one: an answer with no expiry, not one that never expires."
          oneOf:
            - $ref: "#/components/schemas/ReferencePeriod"
            - type: "null"
        retrieval_date: { type: string, format: date-time, description: "When the gate was checked. Defaults to now." }
        override_reason: { type: [string, "null"], description: "An override is audited: the server records the moment it was given as override_date." }
        citations:
          type: array
          description: "The pages the answer was read from. Replaces the previous answer's pages."
          items: { type: string, format: uri }

    MatchRuleResult:
      allOf:
        - $ref: "#/components/schemas/MatchRuleResultInput"
        - type: object
          required: [match_rule, candidate]
          properties:
            match_rule: { type: string }
            candidate: { type: string }
            is_proposal:
              type: boolean
              description: >-
                A model answered and nobody has confirmed it. A proposal is displayed with its
                sources and rules nothing out (reqs.md 6.10 use 3); confirming it means writing
                the same answer as `manual`, which replaces it.
            citations:
              type: array
              description: >-
                The pages this verdict was read from. A gate decided by manual or LLM-assisted
                research carries the same obligation to show its sources that a value does
                (reqs.md 3.7, 6.9).
              items: { type: string, format: uri }
            override_date: { type: [string, "null"], format: date-time }

    CompoundRule:
      type: object
      required: [id, name, level, shape, outcome, inputs, description]
      properties:
        id: { type: string }
        name: { type: string }
        description:
          type: string
          description: >-
            What the rule tests, in words: what it does when it fires, and each condition's
            attribute by its catalog name with its band and unit -- "Warns when Cost of living
            index is at most 80 and Total tax rate is at least 40%." Written from the conditions
            when they are read, so it cannot disagree with them; never an identifier.
        level: { type: string }
        shape: { type: string, enum: [ShareOfHouseholdField, SumBelowFloor, AllConditionsHold] }
        outcome: { type: string, enum: [warning, not_matching] }
        threshold_min: { type: [number, "null"] }
        threshold_max: { type: [number, "null"] }
        inputs:
          type: array
          description: >-
            In order. Each is an attribute or a household field. Used by ShareOfHouseholdField
            and SumBelowFloor, which take their thresholds at rule level.
          items:
            type: object
            properties:
              input_order: { type: integer }
              attribute: { type: [string, "null"] }
              household_field: { type: [string, "null"] }
        conditions:
          type: array
          description: >-
            Used by AllConditionsHold. Each names one attribute and its own band, in that
            attribute's own unit; the rule fires when every condition holds. A null bound is
            unbounded on that side. AND is the only connective and it is implicit in the shape,
            so there is deliberately no operator field -- see reqs.md 3.7a.
          items:
            type: object
            properties:
              ordinal: { type: integer }
              attribute: { type: string }
              threshold_min: { type: [number, "null"] }
              threshold_max: { type: [number, "null"] }

    RunRequest:
      allOf:
        - $ref: "#/components/schemas/RunScope"
        - type: object
          properties:
            accept_uncapped_spend:
              type: boolean
              default: false
              description: >-
                Accept a run that can cost money while no spend cap is set. Not a setting and
                not remembered: it is a sentence about this one run, because the alternative to
                asking is inventing a ceiling (reqs.md 6.3). Ignored when a cap is set, and
                meaningless when every source in the run is free.

    RunScope:
      type: object
      required: [level]
      properties:
        level: { type: string }
        candidates: { type: [array, "null"], items: { type: string }, description: Null means every candidate at the level. }
        attributes: { type: [array, "null"], items: { type: string }, description: Null means every attribute at the level. }

    RunPlan:
      type: object
      required: [items_total, llm_call_count, estimated_cost_eur]
      properties:
        items_total: { type: integer }
        llm_call_count: { type: integer }
        estimated_cost_eur: { type: number }
        by_source:
          type: array
          items:
            type: object
            properties: { data_source: { type: string }, items: { type: integer } }
        estimate_basis:
          type: [string, "null"]
          description: "What the euro figure rests on, when it is not zero. A cost with no stated assumptions cannot be judged, only trusted."

    ResearchPlan:
      type: object
      required: [gates_total, llm_call_count, estimated_cost_eur]
      properties:
        gates_total:
          type: integer
          description: Gate-and-candidate pairs a pass would ask about.
        llm_call_count:
          type: integer
          description: "Equal to `gates_total` while one gate is one question, which is how the researcher asks."
        estimated_cost_eur: { type: number }
        estimate_basis: { type: [string, "null"] }

    Run:
      type: object
      required: [id, run_status, started_at]
      properties:
        id: { type: integer }
        run_status:
          type: string
          enum: [running, completed, halted_on_spend_cap, halted_by_user, failed]
          description: >-
            The three ways of not finishing are three different facts: halted_on_spend_cap
            means the money ran out, halted_by_user means a person stopped it, and failed
            means it broke or its process died.
        stop_requested_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When somebody asked this run to stop, or null. A run still `running` with this set
            will stop when the source in flight finishes -- which is a different thing to tell
            a reader than "running".
        triggered_by: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        llm_call_count: { type: integer }
        cost_eur: { type: number }
        scope_candidates:
          type: integer
          description: >-
            How many candidates the pass was asked about. The scope is stored expanded, so a
            history row carries its size rather than its contents.
        scope_attributes: { type: integer, description: How many attributes the pass was asked about. }
        items_total: { type: integer, description: "The planned cross product: every attribute in scope, for every candidate in scope." }
        items_completed: { type: integer, description: Pairs that produced a value row. }
        items_failed:
          type: integer
          description: >-
            Pairs some source failed on and no source answered, so it never overlaps
            items_completed. The same arithmetic RunDetail.progress reports.

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            scope: { $ref: "#/components/schemas/RunScope" }
            progress:
              type: object
              properties:
                items_total: { type: integer }
                items_completed: { type: integer }
                items_failed: { type: integer, description: "Items some source failed on and no source answered. An item OECD failed on and the estimate answered is complete; the failure is still listed." }
                items_unanswered: { type: integer, description: "Items asked about that produced neither a figure nor a failure: every source asked answered, and none of them had a row for that candidate. The three counts sum to items_total." }
            unanswered:
              type: array
              description: >-
                The items nobody answered, so they can be asked again. Derived rather than
                stored: an unanswered item is the absence of a value row and of a failure row,
                and a second record of that absence could disagree with the first.
              items:
                type: object
                required: [candidate, attribute]
                properties:
                  candidate: { type: string }
                  attribute: { type: string }
            by_source:
              type: array
              description: >-
                What each source contributed: the items it stored a figure for, and the items
                it failed on. Derived from the value and failure rows rather than stored, for
                the reason Q217 settled for items_unanswered -- a second record of the same
                arithmetic can disagree with the first. The two counts are independent and do
                not sum to anything: a source may fail on an item another source then answers,
                and both are true of that run.
              items:
                type: object
                required: [data_source, items_stored, items_failed]
                properties:
                  data_source: { type: string }
                  items_stored: { type: integer }
                  items_failed: { type: integer }
            reconfirmed:
              type: array
              description: >-
                Pairs a source answered with a figure already on record for the same observation,
                so no new row carries this run. `value` is the stored figure it restated; null where
                that is not known -- a pair that restated more than one stored row, in one batch
                or across several, or a re-confirmation recorded before runs named the figure,
                with more than one row it could have restated. A null is never evidence that a
                figure is unchanged.
              items:
                type: object
                required: [data_source, candidate, attribute, value]
                properties:
                  data_source: { type: string }
                  candidate: { type: string }
                  attribute: { type: string }
                  value: { type: [integer, "null"] }
            failures:
              type: array
              items:
                type: object
                required: [data_source, candidate, attribute, error_message]
                properties:
                  data_source: { type: string, description: "Which source failed. Two may answer one attribute, and a retry asks only the one that failed." }
                  candidate: { type: string }
                  attribute: { type: string }
                  error_message: { type: string }

    Holdings:
      type: object
      required: [level, pairs_total, values_stored, values_past_allowed_age, values_older_than_refetch_age, spent, gaps]
      properties:
        level: { type: string }
        pairs_total:
          type: integer
          description: >-
            Candidate and attribute pairs at the level that a switched-on source can fetch, that a
            declared stand-in can lend, or that already hold a figure.
        values_stored: { type: integer, description: "Of those, the pairs with a value in use (the active value)." }
        values_past_allowed_age:
          type: integer
          description: "Pairs whose value in use has a reference period older than their attribute's maximum age: the ones the active-value rule calls stale. Counted per pair, as values_stored is."
        values_older_than_refetch_age:
          type: [integer, "null"]
          description: "Pairs whose last accepted figure was retrieved longer ago than the refetch setting. Null while the setting is unset."
        spent:
          type: object
          required: [since, runs_eur, research_eur, total_eur]
          properties:
            since: { type: string, format: date-time }
            runs_eur: { type: number, description: "What acquisitions started at or after `since` cost." }
            research_eur: { type: number, description: "What gate research ledgered at or after `since` cost." }
            total_eur: { type: number }
        gaps:
          type: object
          required: [failed, unanswered, not_reached]
          properties:
            failed:
              type: array
              items:
                type: object
                required: [candidate, attribute, data_acquisition_run, failures]
                properties:
                  candidate: { type: string }
                  attribute: { type: string }
                  data_acquisition_run: { type: integer, description: "The latest acquisition that asked about the pair." }
                  failures:
                    type: array
                    items:
                      type: object
                      required: [data_source, error_message]
                      properties: { data_source: { type: string }, error_message: { type: string } }
            unanswered:
              type: array
              items:
                type: object
                required: [candidate, attribute, data_acquisition_run]
                properties: { candidate: { type: string }, attribute: { type: string }, data_acquisition_run: { type: integer } }
            not_reached:
              type: array
              description: "Pairs the latest acquisition that included them never reached, or that no acquisition has asked about (data_acquisition_run null)."
              items:
                type: object
                required: [candidate, attribute, data_acquisition_run]
                properties: { candidate: { type: string }, attribute: { type: string }, data_acquisition_run: { type: [integer, "null"] } }

    Warning:
      type: object
      required: [compound_rule, detail]
      properties:
        compound_rule: { type: string }
        detail: { type: string, description: "In words: attributes and gates named as the catalog names them, with units where the catalog has them and figures at a readable precision; never an identifier or a vocabulary token. Frozen as written when a ranking is saved." }
        inputs:
          type: array
          description: >-
            The figures the rule read, each with its source and both dates, in the order the
            rule names them -- for a saved ranking, the rows it read when it was saved, never
            today's (D46). Empty when the ranking was saved before its evidence was kept.
          items: { $ref: "#/components/schemas/Value" }

    NonMatchReason:
      type: object
      description: Exactly one of criterion, match_rule or compound_rule is set.
      required: [reason_detail]
      properties:
        criterion: { type: [string, "null"], description: The attribute whose matching threshold was crossed. }
        match_rule: { type: [string, "null"] }
        compound_rule: { type: [string, "null"] }
        reason_detail: { type: string, description: "In words: attributes and gates named as the catalog names them, with units where the catalog has them and figures at a readable precision; never an identifier or a vocabulary token. Frozen as written when a ranking is saved. A gate's own recorded reason is served as it was written." }
        gate_answer:
          description: >-
            The answer a gate's refusal read, as it stood then: a saved ranking keeps the version
            it read however the gate is answered later (D46). Null for any other reason, and for
            a refusal saved before its evidence was kept.
          oneOf:
            - $ref: "#/components/schemas/MatchRuleResult"
            - type: "null"
        inputs:
          type: array
          description: >-
            The figure a threshold judged, or a compound rule's inputs in the order it names
            them, each with its source and both dates (D46). Empty for a gate, which reads no
            figure, and for a refusal saved before its evidence was kept.
          items: { $ref: "#/components/schemas/Value" }

    CandidateResult:
      type: object
      required: [candidate, name, score, coverage, match_status]
      properties:
        candidate: { type: string }
        name: { type: string, description: "The roster's name. A saved ranking's candidate that has since left the roster reads as its identifier made into words, never the identifier itself." }
        rank: { type: [integer, "null"], description: Null when the candidate does not match. }
        # No maximum. The ceiling is the evaluation's own score_scale_max, which is a setting
        # the user edits, so it cannot be stated here as a constant (same reason as the frozen
        # anchors below).
        score: { type: [integer, "null"], minimum: 0, description: "Null only when insufficient data. On the enclosing response's score_scale_max." }
        insufficient_reason:
          type: [string, "null"]
          description: >-
            Why this candidate could not be scored, in words -- a blocking criterion with no
            figure, or coverage below the floor. Null whenever there is a score. Separate from
            non_match_reasons, which say why a candidate that COULD be scored does not match:
            "we could not measure this" and "we measured it and it fails" are different things
            to show. In words: attributes and gates named as the catalog names them, with units where the catalog has them and figures at a readable precision; never an identifier or a vocabulary token. Frozen as written when a ranking is saved.
        coverage: { type: number, minimum: 0, maximum: 100, description: "Percentage, 0-100. The share of active weight actually backed by data." }
        pillar_scores:
          type: array
          description: >-
            This candidate's total broken down by pillar -- what each of the eleven verticals
            scored, what it was worth after redistribution, and what it put into the total.
            Enough to read a score's shape without asking for the attribute-level breakdown,
            which is 43 rows per candidate where this is 11. A pillar with no figure at all is
            present with a null score rather than absent, because "nothing was found here" is
            the thing a reader most needs to see.
          items: { $ref: "#/components/schemas/PillarScore" }
        delta_vs_home:
          type: [number, "null"]
          description: >-
            This candidate's score minus the home country's (`reqs.md` 1.2, section 3.9), so
            "stay put" stays measurable beside every alternative. Null for the home country
            itself, and null when either score is absent -- a difference against an unscoreable
            candidate is not zero, it is unanswerable.
            A saved ranking takes it between its own saved scores, against the household's
            current home country, which the ranking does not record.
        coverage_by_confidence:
          type: [object, "null"]
          description: >-
            How the covered weight splits by confidence (`reqs.md` 5.7), as percentages of the
            covered weight summing to 100. Coverage alone cannot show that a candidate reached
            100% entirely on extrapolation; this can. Null when nothing is covered: a split of
            nothing is not a split, and four zeros would read as one.
          properties:
            absolute: { type: number }
            high: { type: number }
            medium: { type: number }
            low: { type: number }
        match_status: { type: string, enum: [matching, not_matching, insufficient_data] }
        parent_not_matching: { type: boolean }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        non_match_reasons: { type: array, items: { $ref: "#/components/schemas/NonMatchReason" } }
        parent_score: { type: [integer, "null"], description: "The country's score, shown beside a city for context. Never added in." }

    Ranking:
      type: object
      required: [criteria_set, level, computed_at, score_scale_max, candidates]
      properties:
        evaluation: { type: [integer, "null"], description: Set when this is a saved evaluation rather than a live computation. }
        criteria_set: { type: string }
        level: { type: string }
        computed_at: { type: string, format: date-time }
        score_scale_max:
          type: integer
          minimum: 1
          description: >-
            The top of the score range every score in this ranking is on: the setting at the
            moment a live ranking was computed, the frozen value for a saved one. Draw and label
            every score, pillar score and difference against this, never against the current
            setting, which may have changed since. Anchored criteria do not rescale when the
            range changes: an anchor's score is the number it was given.
        candidates:
          type: array
          description: >-
            In display order: the ranked candidates by rank, then every unranked candidate by
            score, highest first, those with no score last; ties by candidate id. The same order
            for a live and a saved ranking.
          items: { $ref: "#/components/schemas/CandidateResult" }

    EvaluationSummary:
      type: object
      required: [id, criteria_set, level, computed_at, score_scale_max]
      properties:
        id: { type: integer }
        criteria_set: { type: string }
        level: { type: string }
        computed_at: { type: string, format: date-time }
        score_scale_max:
          type: integer
          description: >-
            The top of the score range this evaluation used, frozen with it. Read scores
            against this rather than against the current setting, which may since have changed.
        note: { type: [string, "null"] }
        leader:
          description: >-
            The candidate ranked first, with the roster's name for it -- a candidate that has
            since left the roster reads as its identifier made into words. Null when nobody was
            ranked.
          oneOf:
            - type: object
              required: [candidate, name]
              properties:
                candidate: { type: string }
                name: { type: string }
            - type: "null"

    AttributeScore:
      type: object
      required: [attribute, pillar, normalised_score, weight, effective_weight, contribution]
      properties:
        attribute: { type: string }
        pillar: { type: string }
        normalised_score: { type: [integer, "null"], description: "0 to the enclosing response's score_scale_max. Null when no value was available." }
        weight: { type: number, minimum: 0, maximum: 100, description: "Percentage of the whole level, 0-100, as configured: the criterion's share of its pillar times its pillar's share of the level, after excluded criteria are taken out and before any redistribution for missing data. The scored criteria's weights sum to 100. A saved evaluation's are computed from its frozen criteria." }
        effective_weight: { type: number, minimum: 0, maximum: 100, description: "Percentage of the whole level, 0-100, after the weight of every criterion with no figure was spread proportionally over every criterion that has one (reqs.md 5.3). Zero for a criterion with no figure. contribution = exact score x effective_weight / 100." }
        contribution: { type: number }
        value:
          description: >-
            The exact figure scored, with its source and both dates -- for a saved evaluation,
            the row it scored when it was saved (D46). Null when no figure was available.
          oneOf:
            - $ref: "#/components/schemas/Value"
            - type: "null"
        alternative_values:
          type: array
          description: Every other stored value for this attribute — superseded, rejected, from other sources.
          items: { $ref: "#/components/schemas/Value" }

    PillarScore:
      type: object
      required: [pillar, score, weight, contribution]
      properties:
        pillar: { type: string }
        score:
          type: [integer, "null"]
          minimum: 0
          description: >-
            What this pillar scored, as a weighted mean of its criteria, from 0 to the enclosing
            response's score_scale_max. Null when no criterion in it was scored -- zero would
            read as "measured, and bad".
        weight:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Percentage, 0-100. What this pillar counted for across the level AFTER
            redistribution, so the eleven sum to the weight that actually scored rather than to
            the weight that was configured.
        contribution:
          type: number
          description: score x weight / 100 -- what this pillar put into the total. Zero when nothing scored.

    CandidateScoreDetail:
      allOf:
        - $ref: "#/components/schemas/CandidateResult"
        - type: object
          required: [score_scale_max]
          properties:
            score_scale_max:
              type: integer
              minimum: 1
              description: >-
                The top of the score range this candidate's scores are on: the live setting, or
                the saved evaluation's frozen value.
            attribute_scores: { type: array, items: { $ref: "#/components/schemas/AttributeScore" } }

    ComparisonAttributeRow:
      type: object
      required: [attribute, focus, effective_weight]
      properties:
        attribute: { type: string }
        pillar: { type: string }
        effective_weight:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            What this attribute counted for in the focus's total after redistribution, on the
            basis AttributeScore.effective_weight uses. Zero where the focus has no figure.
        focus:
          type: object
          properties:
            value: { $ref: "#/components/schemas/Value" }
            normalised_score: { type: [integer, "null"] }
        comparators:
          type: array
          items:
            type: object
            properties:
              candidate: { type: string }
              value: { $ref: "#/components/schemas/Value" }
              normalised_score: { type: [integer, "null"] }
              delta: { type: [number, "null"], description: "Comparator minus focus. In the attribute's own unit, except a Monetary attribute, whose delta is in EUR -- the only figure comparable across candidates that may hold different currencies (reqs.md 5.5). Null unless both sides have a figure, and null when the two figures declare different scales -- an Index from two publishers, or two assigned scores on different ranges -- because their difference is in no unit (C06-S2); the two figures are still sent, so the interface can say \"different scales\"." }
              weighted_contribution: { type: [number, "null"], description: "What the score gap is worth to the focus's total, comparator minus focus: the exact score difference times the focus's effective weight, in score points. Null unless both sides were scored." }

    Comparison:
      type: object
      required: [criteria_set, level, score_scale_max, focus, comparators, attributes]
      properties:
        criteria_set: { type: string }
        level: { type: string }
        score_scale_max:
          type: integer
          minimum: 1
          description: >-
            The top of the score range the focus's and comparators' scores are on. Always the
            live setting: a comparison is computed, never stored.
        focus: { $ref: "#/components/schemas/CandidateResult" }
        comparators: { type: array, items: { $ref: "#/components/schemas/CandidateResult" } }
        attributes: { type: array, items: { $ref: "#/components/schemas/ComparisonAttributeRow" } }
        synthesis:
          type: array
          description: >-
            One entry per comparator, in the order of `comparators`. Templated from weighted
            contributions, never model-written; deterministic. Read from the comparator's side:
            `score_delta` is its total minus the focus's, `advantages` are what it leads on and
            `disadvantages` what it trails on.
          items:
            type: object
            required: [comparator, score_delta, advantages, disadvantages, ahead, behind, not_comparable]
            properties:
              comparator: { type: string }
              score_delta:
                type: [integer, "null"]
                description: The comparator's total minus the focus's. Null when either has no total.
              advantages: { type: array, items: { type: string }, description: "Deprecated; removed once the interface reads `ahead`." }
              disadvantages: { type: array, items: { type: string }, description: "Deprecated; removed once the interface reads `behind`." }
              ahead:
                type: array
                description: The pillars the comparator leads on, most worth first, at most three. Empty when either side has no total.
                items: { $ref: "#/components/schemas/SynthesisLine" }
              behind:
                type: array
                description: The pillars the comparator trails on, most worth first, at most three. Empty when either side has no total.
                items: { $ref: "#/components/schemas/SynthesisLine" }
              not_comparable:
                type: array
                description: Pillars left out because either side has no score there, in the focus's pillar order.
                items: { type: string }

    SynthesisLine:
      type: object
      required: [pillar, worth]
      properties:
        pillar: { type: string }
        worth:
          type: number
          description: >-
            What this pillar's gap is worth to the total, comparator minus focus, in score
            points: the comparator's pillar contribution minus the focus's -- the figure the
            matrix shows for this pillar under "Weighted impact". Never zero.

    ExternalScore:
      type: object
      required: [candidate, data_source, published_scale]
      properties:
        candidate: { type: string }
        data_source: { type: string }
        published_value: { type: [number, "null"] }
        published_scale: { type: string }
        published_rank: { type: [integer, "null"] }
        published_rank_of: { type: [integer, "null"] }
        reference_period: { $ref: "#/components/schemas/ReferencePeriod" }
        retrieval_date: { type: string, format: date-time }
        methodology_url: { type: [string, "null"], format: uri }
        caveats: { type: [string, "null"] }
