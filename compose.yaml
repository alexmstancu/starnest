# Three containers: database, backend, ui.
#
# Everything configurable comes from .env, which is never committed. .env.example documents
# the shape with placeholder values; copy it and fill it in.
#
#   cp .env.example .env
#   docker compose up -d database
#   docker compose run --rm migrate      # explicit, never automatic -- see below
#   docker compose up -d backend ui
#
# There is no authentication in this application and there never will be (reqs.md 10).
# Every published port is therefore bound to 127.0.0.1 explicitly. A bare "8000:8000" would
# publish on every interface, and on a laptop that means the local network.

name: starnest

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # The audit is the database's own statement log (arch.md 10.7). No audit tables, no
    # triggers, no changelog of ours.
    #
    # 'mod' rather than 'all': 'all' includes every SELECT, and a UI that re-queries on each
    # slider movement would bury the handful of statements that changed something under
    # thousands that read something. Switch to 'all' temporarily when debugging a read path.
    command:
      - postgres
      - -c
      - log_statement=mod
      - -c
      - log_line_prefix=%m [%p] %u@%d
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Inside the compose network the host is the service name, so the .env value (which
      # points at localhost, for running the backend outside Docker) is overridden here.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    # The healthcheck uses a real endpoint from the contract rather than a /health route
    # invented for the purpose. Adding a path would be a change to openapi.yaml, which has
    # consumers other than this file (devplan.md 0.3).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/settings', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
    # No backend URL is baked in. nginx proxies /v1 to the backend service, so the browser
    # makes same-origin requests and no CORS configuration exists anywhere.

  # -------------------------------------------------------------------------
  # One-shot services. Both are profile-gated so `docker compose up` never runs them.
  # -------------------------------------------------------------------------

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    # Migrations run by an explicit command, never automatically at startup (arch.md 7.4).
    # A process that migrates when it boots will one day migrate when you did not intend it
    # to. The backend instead refuses to start against a schema it does not recognise,
    # naming the gap -- which is what makes running this separately safe rather than fragile.
    command: >
      yoyo apply --batch
        --database postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
        /app/storage/migrations

  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    # Run before every migration (arch.md 9.5). The reasoning is specific: structured values
    # could be re-fetched slowly, LLM values would cost money again, and manually entered
    # values -- visa verdicts, quota research, exclusion reasons -- cannot be re-fetched at
    # all. Those are what this protects.
    command: >
      sh -c 'PGPASSWORD=${POSTGRES_PASSWORD}
             pg_dump -h database -U ${POSTGRES_USER} -d ${POSTGRES_DB}
             --format=custom
             --file=/backups/$$(date +%Y%m%d-%H%M%S).dump'

volumes:
  postgres-data:
