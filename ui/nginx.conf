server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, same-origin.
    #
    # The client calls /v1/... with a relative path, so the browser never makes a
    # cross-origin request and the backend needs no CORS configuration at all. It also means
    # no API base URL is compiled into the bundle -- moving the backend is a change here,
    # not a rebuild of the interface.
    location /v1/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A data acquisition run is started with one POST and then polled (arch.md 8.4), so
        # no request is long-lived. These are generous enough for a slow source and short
        # enough that a hung request surfaces instead of hanging the screen.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Gate research (reqs.md 6.10 use 3) is the one /v1 call that returns its result in the
    # response rather than being started and polled. Since UI-01 a pass is one request per gate:
    # the server asks only a gate research can answer, about the one country it concerns, so a
    # request is at most one slow model call -- and the backend bounds each call to 240 s with no
    # retry (NEW-04, LLM_TIMEOUT_SECONDS). The 60s read timeout above would still cut that call
    # short into a 504 hiding its proposal, its cost and any cap halt, so an exact-match location,
    # which nginx prefers over the /v1/ prefix, gives it a ceiling that covers one slow call. A
    # ceiling, not "no limit"; the durable job/poll protocol the acquisition runs use is still the
    # proper long-term shape.
    location = /v1/match-rule-research {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Single-page app: every unknown path is a client route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The hashed build assets are immutable; index.html must never be, or a deploy is
    # invisible until someone clears their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The application display name lives here, written from APP_DISPLAY_NAME when the container
    # starts (docker-entrypoint.d/40-display-name.sh), and fetched before first paint. Caching
    # it would make renaming the product a cache-clearing exercise instead of a restart.
    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
